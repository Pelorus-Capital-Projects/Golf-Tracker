#worldWrap{position:fixed;z-index:-1;pointer-events:none;left:10px;right:10px;top:calc(env(safe-area-inset-top) + 74px);bottom:calc(var(--tabs-h) + env(safe-area-inset-bottom) + 6px)}

.wrap{max-width:560px;margin:0 auto;padding:0 14px}

.brand{font-family:'GT Brand',Georgia,"Times New Roman",serif;font-style:italic;font-weight:700;font-size:22px;letter-spacing:.005em}
.brand small{display:block;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-style:normal;font-weight:500;font-size:12px;color:rgba(255,255,255,.82);letter-spacing:0}
.pill{font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;background:var(--gold);color:var(--gold-ink);white-space:nowrap}
.pill.bad{background:#fff;color:var(--danger)}
.pill[hidden]{display:none}
main{padding:14px 0 calc(var(--tabs-h) + env(safe-area-inset-bottom) + 24px)}
h2{font-size:20px;margin:4px 0 10px;letter-spacing:-.01em}
h3{font-size:16px;margin:0 0 6px}
.card{background:rgba(255,255,255,.88);border:1px solid var(--ring);box-shadow:0 1px 2px rgba(0,61,42,.05);border-radius:var(--radius);padding:14px;margin-bottom:12px}
.muted{color:var(--muted)}
.ink2{color:var(--ink2)}
.small{font-size:13px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  border:1px solid var(--ring);background:var(--surface);border-radius:12px;
  padding:12px 16px;font-weight:600;min-height:46px
}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.danger{color:var(--danger)}
.btn.block{width:100%}
.btn.big{min-height:64px;font-size:20px;border-radius:16px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink2);padding:8px 10px;min-height:40px}
.btn:disabled{opacity:.45}
.btn:active{transform:scale(.985)}
.banner{border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:12px;display:flex;gap:10px;align-items:flex-start}
.banner.warn{background:var(--warn-soft);color:var(--warn-ink)}
.banner.bad{background:var(--danger-soft);color:var(--danger)}
.banner .x{margin-left:auto;background:none;border:0;font-size:18px;line-height:1;padding:0 2px;color:inherit;opacity:.7}

/* club grid */
.clubs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.club{
  position:relative;border:1px solid var(--ring);background:var(--surface);border-radius:12px;
  min-height:52px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-weight:700;font-size:15px
}
.club .n{font-size:11px;font-weight:600;color:var(--muted);margin-top:1px}
.club.sel{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.club.sel .n{color:var(--gold);opacity:1}

/* segmented bar */
.seg{display:flex;gap:2px;height:28px;border-radius:4px;overflow:hidden;background:transparent;margin:8px 0 6px}
.seg.empty{background:var(--surface2);border-radius:4px}
.seg-part{display:flex;align-items:center;padding-left:6px;font-size:12px;font-weight:700;min-width:0;border-radius:4px}
.seg-part span{white-space:nowrap}
.s-hook{background:var(--hook);color:var(--hook-ink)}
.s-draw{background:var(--draw);color:var(--draw-ink)}
.s-straight{background:var(--straight);color:var(--straight-ink)}
.s-fade{background:var(--fade);color:var(--fade-ink)}
.s-slice{background:var(--slice);color:var(--slice-ink)}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:var(--ink2)}
.legend .k{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.sw{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}
.sw.hook{background:var(--hook)}.sw.draw{background:var(--draw)}.sw.straight{background:var(--straight)}.sw.fade{background:var(--fade)}.sw.slice{background:var(--slice)}
.legend b{color:var(--ink);font-weight:600}
.dir{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.dir div{background:var(--surface2);border-radius:10px;padding:6px 8px;text-align:center}
.dir .v{font-weight:700;font-size:18px}
.dir .l{font-size:12px;color:var(--muted)}
.strike{font-size:13px;color:var(--ink2);margin-top:8px}
.strike b{color:var(--ink)}
.note{font-size:12px;color:var(--muted);margin-top:6px}

/* recent balls */
.recent{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{border:0;font:inherit;font-size:12px;padding:4px 8px;border-radius:999px;background:var(--surface2);color:var(--ink2);display:inline-flex;align-items:center;gap:5px}

/* sheet */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:50;display:none}
.overlay.show{display:block}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--surface);
  border-radius:20px 20px 0 0;padding:14px 14px calc(env(safe-area-inset-bottom) + 16px);
  transform:translateY(105%);transition:transform .18s ease-out, visibility 0s linear .18s;max-height:92vh;overflow:auto;
  box-shadow:0 -6px 30px rgba(0,0,0,.18);visibility:hidden
}
.sheet.show{transform:none;visibility:visible;transition:transform .18s ease-out, visibility 0s}
.sheet .inner{max-width:560px;margin:0 auto}
.grabber{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 10px}
.seglabel{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:12px 0 6px}
.strikes{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.sbtn{border:1px solid var(--ring);background:var(--surface2);border-radius:12px;min-height:48px;font-weight:600}
.sbtn.on{background:#fff;color:var(--accent);border:2px solid var(--accent);font-weight:700}
.sbtn.on::before{content:"✓ "}
.shapes{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.shape{
  border:0;border-radius:14px;min-height:108px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  font-weight:700;font-size:14px;padding:6px 2px
}
.shape svg{width:34px;height:46px}
.putts{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,auto);gap:6px}
.putt{border:1px solid var(--ring);background:var(--surface2);border-radius:14px;min-height:76px;font-weight:700;font-size:15px}
.putt.holed{background:var(--accent);color:var(--accent-ink);border-color:transparent}

/* tabs */
nav.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom)
}
nav.tabs .wrap{display:grid;grid-template-columns:repeat(6,1fr);height:var(--tabs-h);padding:0}
nav.tabs button{background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted);padding:0;min-width:0;letter-spacing:-.1px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button{position:relative}
nav.tabs button.on{color:var(--accent)}
nav.tabs button.on::before{content:"";position:absolute;top:0;left:28%;right:28%;height:3px;border-radius:0 0 3px 3px;background:var(--gold)}

/* toast + modal */
#toast{z-index:110 !important;
  position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 64px);transform:translateX(-50%) translateY(-12px);
  background:var(--accent-dark);color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;border:2px solid var(--gold);
  opacity:0;pointer-events:none;transition:all .18s;z-index:90;max-width:90vw;text-align:center
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.act{pointer-events:auto;display:flex;align-items:center;gap:10px;padding:6px 6px 6px 16px;text-align:left}
.tundo{flex:none;border:0;border-radius:999px;background:var(--gold);color:#1a1a1a;font-weight:800;font-size:15px;min-height:38px;padding:0 16px}
.modal{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,.4)}
.modal.show{display:flex}
.modal .box{background:var(--surface);border-radius:18px;padding:18px;max-width:400px;width:100%}
.modal .box p{margin:6px 0 14px;color:var(--ink2)}
.modal .btns{display:flex;flex-direction:column;gap:8px}

/* stats */
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.fbtn{border:1px solid var(--ring);background:var(--surface);border-radius:999px;padding:8px 12px;font-size:13px;font-weight:600}
.fbtn.on{background:var(--accent);color:#fff;border-color:transparent}
.stat-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}

function ago(ts){
  if(!ts) return 'never';
  const m = Math.round((Date.now() - ts) / 60000);
  if(m < 1) return 'just now';
  if(m < 60) return m + ' min ago';
  const h = Math.round(m / 60);
  if(h < 24) return h + ' h ago';
  const d = Math.round(h / 24);
  return d === 1 ? '1 day ago' : d + ' days ago';
}

function normaliseBag(list){
  const seen = new Set(), out = [];
  (Array.isArray(list) ? list : []).forEach(c => {
    if(!c || !c.id || seen.has(String(c.id))) return;
    seen.add(String(c.id));
    out.push({id:String(c.id), short:String(c.short || c.id).slice(0, 5), name:String(c.name || c.id),
      make:String(c.make || ''), model:String(c.model || ''), type: TYPE[c.type] ? c.type : 'iron',
      retired:!!c.retired, addedAt:+c.addedAt || 0, retiredAt:c.retiredAt ? +c.retiredAt : null});
  });
  return out;
}
function normaliseProfile(p0, base){
  const p = Object.assign({}, base, p0 && typeof p0 === 'object' ? p0 : {});
  ['name','surname','photo','homeCourse','bestScoreCourse','bestScoreDate'].forEach(k => p[k] = typeof p[k] === 'string' ? p[k] : '');
  if(p.photo && !/^data:image\/(jpeg|png|webp);base64,/.test(p.photo)) p.photo = '';
  p.handicap = typeof p.handicap === 'number' && isFinite(p.handicap) ? p.handicap : null;
  p.bestScore = Number.isInteger(p.bestScore) ? p.bestScore : null;
  p.handicapHistory = Array.isArray(p.handicapHistory) ? p.handicapHistory.filter(h => h && typeof h.v === 'number' && h.d) : [];
  p.countries = Array.isArray(p.countries) ? Array.from(new Set(p.countries.filter(c => typeof c === 'string' && /^[\w]{1,12}$/.test(c)))).slice(0, 300) : [];
  return p;
}
function normalise(d){
  const base = emptyData();
  if(!d || typeof d !== 'object') return base;
  // v1 backups have no bag: they get the default bag, whose ids match their shots
  const bag = Array.isArray(d.bag) && d.bag.length ? normaliseBag(d.bag) : base.bag;
  const map = Object.fromEntries(bag.map(c => [c.id, c]));
  const out = {
    app: APP_ID, schema: SCHEMA,
    settings: Object.assign({}, base.settings, d.settings || {}),
    profile: normaliseProfile(d.profile, base.profile),
    bag,
    meta: Object.assign({}, base.meta, d.meta || {}),
    sessions: [],
    rounds: [],
    courses: {}
  };
  const cleanMap = (m, ok) => { const o = {}; if(m && typeof m === 'object') Object.keys(m).forEach(k => { const h = +k, v = m[k]; if(h >= 1 && h <= 18 && ok(v)) o[h] = v; }); return o; };
  if(d.courses && typeof d.courses === 'object') Object.keys(d.courses).forEach(k => {
    const c = d.courses[k]; if(c && typeof c.name === 'string') out.courses[k] = {name:c.name, par:cleanMap(c.par, v => [3, 4, 5, 6].includes(v))};
  });
  const normShots = (list, t0, allowResult) => {
    const shots = [];
    (Array.isArray(list) ? list : []).forEach(x => {
      if(!x || !x.c) return;
      let c = map[x.c];
      if(!c){   // shot for a club missing from the bag: keep it under a retired placeholder
        c = {id:String(x.c), short:String(x.c).slice(0, 5), name:'Club ' + x.c, make:'', model:'',
             type: PUTTS.includes(x.s) ? 'putter' : 'iron', retired:true, addedAt:0, retiredAt:null};
        bag.push(c); map[c.id] = c;
      }
      const dist = allowResult && typeof x.d === 'number' && x.d > 0 && x.d <= 450 ? Math.round(x.d * 10) / 10 : null;
      if(c.type === 'putter'){ if(PUTTS.includes(x.s)){ const pt = {c:c.id, s:x.s, t:x.t || t0}; if(dist) pt.d = dist; if(allowResult && Number.isInteger(x.h) && x.h >= 1 && x.h <= 18) pt.h = x.h; shots.push(pt); } }
      else if(SHAPES.includes(x.s) && STRIKES.includes(x.k || 'clean')){
        const sh = {c:c.id, s:x.s, k:x.k || 'clean', t:x.t || t0};
        if(LINES.includes(x.l)) sh.l = x.l;
        if(allowResult && RESULTS.includes(x.r)) sh.r = x.r;
        if(allowResult && (x.g === 'y' || x.g === 'n')) sh.g = x.g;
        if(dist) sh.d = dist;
        if(allowResult && Number.isInteger(x.h) && x.h >= 1 && x.h <= 18) sh.h = x.h;
        shots.push(sh);
      }
    });
    return shots;
  };
  (Array.isArray(d.sessions) ? d.sessions : []).forEach(s => {
    if(!s || !s.id || !s.startedAt) return;
    const shots = normShots(s.shots, s.startedAt, false);
    out.sessions.push({id:String(s.id), startedAt:+s.startedAt, endedAt:s.endedAt ? +s.endedAt : null, updatedAt:+(s.updatedAt || s.startedAt), shots});
  });
  out.sessions.sort((a, b) => a.startedAt - b.startedAt);
  (Array.isArray(d.rounds) ? d.rounds : []).forEach(r => {
    if(!r || !r.id) return;
    const t0 = +r.startedAt || Date.now();
    const ph = r.photos && typeof r.photos === 'object' ? r.photos : {};
    out.rounds.push({
      id:String(r.id), startedAt:t0, endedAt:r.endedAt ? +r.endedAt : null, updatedAt:+(r.updatedAt || t0),
      date: /^\d{4}-\d{2}-\d{2}$/.test(r.date) ? r.date : isoDay(t0),
      course: typeof r.course === 'string' ? r.course : '', holes: r.holes === 9 ? 9 : 18,
      score: Number.isInteger(r.score) ? r.score : null,
      photos: {cover: typeof ph.cover === 'string' ? ph.cover : null, front: typeof ph.front === 'string' ? ph.front : null, back: typeof ph.back === 'string' ? ph.back : null},
      shots: normShots(r.shots, t0, true),
      mode: r.mode === 'holes' ? 'holes' : null,
      start: r.start === 10 ? 10 : 1,
      cur: Number.isInteger(r.cur) && r.cur >= 1 && r.cur <= 18 ? r.cur : (r.start === 10 ? 10 : 1),
      par: cleanMap(r.par, v => [3, 4, 5, 6].includes(v)),
      pen: cleanMap(r.pen, v => Number.isInteger(v) && v > 0 && v < 10),
      media: (Array.isArray(r.media) ? r.media : []).filter(m => m && typeof m.id === 'string' && (m.kind === 'photo' || m.kind === 'video'))
        .slice(0, 300).map(m => ({id:m.id, kind:m.kind, addedAt:+m.addedAt || 0, dur:Math.max(0, Math.round(+m.dur || 0))})),
      adj: cleanMap(r.adj, v => Number.isInteger(v) && v !== 0 && Math.abs(v) < 21),
      padj: cleanMap(r.padj, v => Number.isInteger(v) && v !== 0 && Math.abs(v) < 11)
    });
    // older versions stored a fixed manual score per hole: turn it into extra strokes on top of the logged shots
    const nr = out.rounds[out.rounds.length - 1];
    Object.entries(cleanMap(r.hs, v => Number.isInteger(v) && v > 0 && v < 21)).forEach(([h, v]) => {
      const d = v - nr.shots.filter(x => x.h === +h).length - (nr.pen[h] || 0);
      if(d) nr.adj[h] = d; else delete nr.adj[h];
    });
  });
  out.rounds.sort((a, b) => a.startedAt - b.startedAt);
  out.rounds.filter(r => !r.endedAt).slice(0, -1).forEach(r => r.endedAt = r.shots.length ? r.shots[r.shots.length - 1].t : r.startedAt);
  // only one open session allowed: close any older open ones
  const open = out.sessions.filter(s => !s.endedAt);
  open.slice(0, -1).forEach(s => s.endedAt = s.shots.length ? s.shots[s.shots.length - 1].t : s.startedAt);
  const lc = map[out.settings.lastClub];
  if(!lc || lc.retired){ const first = bag.find(c => !c.retired); out.settings.lastClub = first ? first.id : ''; }
  const rc = map[out.settings.lastRoundClub];
  if(!rc || rc.retired){ const first = bag.find(c => !c.retired); out.settings.lastRoundClub = first ? first.id : ''; }
  out.deleted = {};
  const old = Date.now() - 400 * 864e5;
  if(d.deleted && typeof d.deleted === 'object') Object.keys(d.deleted).forEach(k => { const v = +d.deleted[k]; if(/^[\w-]{1,40}$/.test(k) && v > old) out.deleted[k] = v; });
  out.sessions = out.sessions.filter(x => !(out.deleted[x.id] >= (x.updatedAt || x.startedAt || 0)));
  out.rounds = out.rounds.filter(x => !(out.deleted[x.id] >= (x.updatedAt || x.startedAt || 0)));
  return out;
}

let data;
let loadError = null;
function load(){
  let raw = null;
  try { raw = localStorage.getItem(KEY); } catch(e){ loadError = 'This browser is blocking storage, so nothing can be saved. Turn off Private Browsing.'; }
  if(raw){
    try { data = normalise(JSON.parse(raw)); }
    catch(e){
      try { localStorage.setItem(KEY + ':corrupt-' + Date.now(), raw); } catch(_){}
      loadError = 'Saved data could not be read. A copy was kept — restore your latest backup.';
      data = emptyData();
    }
  } else data = emptyData();
  indexBag();
}

let saveState = {ok:true, at:0};
function save(countsAsChange = true){
  data.meta.updatedAt = Date.now();
  if(countsAsChange) data.meta.changesSinceBackup = (data.meta.changesSinceBackup || 0) + 1;
  indexBag();
  const json = JSON.stringify(data);
  try {
    localStorage.setItem(KEY, json);
    const check = localStorage.getItem(KEY);
    saveState = {ok: check === json, at: Date.now()};
  } catch(e){
    saveState = {ok:false, at:Date.now(), err:e && e.name};
  }
  renderPill();
  if(!saveState.ok) toast('Not saved! Download a backup now.', 3500);
  else if(!applyingRemote) scheduleSync();
  askPersist();
  return saveState.ok;
}
let persistAsked = false;
function askPersist(){
  if(persistAsked) return; persistAsked = true;
  try { if(navigator.storage && navigator.storage.persist) navigator.storage.persist().then(v => { storagePersisted = v; }).catch(()=>{}); } catch(_){}
}
let storagePersisted = null;
function renderPill(){
  const p = $('#savePill');
  // only shown when something goes wrong: a save that worked needs no badge
  if(!saveState.ok){ p.textContent = '⚠ Not saved'; p.className = 'pill bad'; p.hidden = false; return; }
  p.className = 'pill'; p.textContent = ''; p.hidden = true;
}

function holeList(r){ const st = r.start || 1; return Array.from({length:r.holes}, (_, i) => ((st - 1 + i) % 18) + 1); }
const courseKey = name => (name || '').trim().toLowerCase();
function holeInfo(r, h){
  const shots = r.shots.filter(x => x.h === h);
  const pen = r.pen[h] || 0, par = r.par[h] || null, adj = r.adj[h] || 0;
  // strokes = logged shots + penalties + strokes added with the + button; putts = logged putts + putts added with +
  const total = shots.length + pen + adj;
  const score = total > 0 ? total : null;
  const putts = Math.max(0, shots.filter(x => isPutt(x.c)).length + (r.padj[h] || 0));
  // fairway: tee shot on a par 4/5 marked with a result
  let fir = null;
  if(par >= 4 && shots.length && !isPutt(shots[0].c) && shots[0].r) fir = shots[0].r === 'fairway';
  // green in regulation: strokes taken before the first putt (incl. penalties) <= par - 2
  let gir = null;
  if(par){
    if(putts && score !== null) gir = (score - putts) <= par - 2;
    else { const gi = shots.findIndex(x => x.r === 'green'); if(gi >= 0) gir = (gi + 1 + pen) <= par - 2; }
  }
  return {h, par, shots, putts, pen, adj, score, fir, gir, holed: shots.some(x => isPutt(x.c) && x.s === 'holed')};
}
function roundTotals(r){
  let score = 0, par = 0, thru = 0;
  holeList(r).forEach(h => { const i = holeInfo(r, h); if(i.score !== null){ score += i.score; thru++; if(i.par) par += i.par; } });
  return {score, toPar: score - par, thru};
}
const fmtToPar = n => n === 0 ? 'E' : (n > 0 ? '+' + n : String(n));
function ensurePar(r, h){

const isPdfUrl = u => typeof u === 'string' && u.startsWith('data:application/pdf');
function dataUrlToBlob(u){
  const i = u.indexOf(','), bin = atob(u.slice(i + 1)), a = new Uint8Array(bin.length);
  for(let k = 0; k < bin.length; k++) a[k] = bin.charCodeAt(k);
  return new Blob([a], {type: u.slice(5, u.indexOf(';'))});
}
const blobUrls = new Map();
function blobUrlFor(u){
  // PDFs are shown from a blob: URL so the page HTML stays small
  let b = blobUrls.get(u);
  if(!b){ b = URL.createObjectURL(dataUrlToBlob(u)); blobUrls.set(u, b); }
  return b;
}
function cardMedia(u, alt){
  if(!isPdfUrl(u)) return `<img src="${u}" alt="${esc(alt)}">`;
  // Safari draws the first page of a PDF in an <img>; other browsers fall back to a PDF label
  return `<img class="pdfimg" src="${blobUrlFor(u)}" alt="${esc(alt)}"><span class="pdfbadge">PDF</span>`;
}

const IDB_NAME = KEY + '-photos', IDB_STORE = 'photos', MEDIA_STORE = 'media';
const photoCache = new Map();
let photosLoaded = false, photoStoreError = false, idbPromise = null;
function idbOpen(){
  if(!idbPromise) idbPromise = new Promise((res, rej) => {
    const r = indexedDB.open(IDB_NAME, 2);
    r.onupgradeneeded = () => {
      const db = r.result;
      if(!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE);
      if(!db.objectStoreNames.contains(MEDIA_STORE)) db.createObjectStore(MEDIA_STORE);   // added in v2.6
    };
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
  return idbPromise;
}
function idbReq(mode, fn, store = IDB_STORE){
  return idbOpen().then(db => new Promise((res, rej) => {
    const tx = db.transaction(store, mode); let out;
    const rq = fn(tx.objectStore(store)); if(rq) rq.onsuccess = () => { out = rq.result; };
    tx.oncomplete = () => res(out); tx.onerror = tx.onabort = () => rej(tx.error);
  }));
}
async function photoPut(id, url){
  await idbReq('readwrite', st => st.put(url, id));
  const back = await idbReq('readonly', st => st.get(id));       // read back to be sure it stuck
  if(back !== url) throw new Error('verify failed');
  photoCache.set(id, url);
}
async function photoDel(id){ if(!id) return; photoCache.delete(id); try { await idbReq('readwrite', st => st.delete(id)); } catch(_){} }

  photosLoaded = true;
}

}

  for(const k of keys){
    const id = String(k); if(!id.endsWith(':t') || mediaThumbs.has(id.slice(0, -2))) continue;
    const b = await mediaGet(id); if(b) mediaThumbs.set(id.slice(0, -2), URL.createObjectURL(b));

const blobToDataUrl = b => new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = () => rej(fr.error); fr.readAsDataURL(b); });
const canvasBlob = (c, q) => new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error('encode')), 'image/jpeg', q));
function drawScaled(src, sw, sh, max){
  const k = Math.min(1, max / Math.max(sw, sh)), c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(sw * k)); c.height = Math.max(1, Math.round(sh * k));
  c.getContext('2d').drawImage(src, 0, 0, c.width, c.height); return c;
}
async function photoToJpegs(file){
  // round photos: a sharp 2048 px copy to view, plus a small preview for the gallery
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const w = img.naturalWidth, h = img.naturalHeight;
    return {full: await canvasBlob(drawScaled(img, w, h, 2048), 0.85), thumb: await canvasBlob(drawScaled(img, w, h, 360), 0.72)};
  } finally { URL.revokeObjectURL(url); }
}
function videoPoster(file){
  // grab one frame for the gallery; if the phone can't decode it here, the tile just says "Video"
  return new Promise(res => {
    const url = URL.createObjectURL(file), v = document.createElement('video');
    let done = false, tm;
    const finish = out => { if(done) return; done = true; clearTimeout(tm); try { v.pause(); v.removeAttribute('src'); v.load(); } catch(_){} URL.revokeObjectURL(url); res(out); };
    tm = setTimeout(() => finish({blob:null, dur:isFinite(v.duration) ? v.duration : 0}), 8000);
    v.muted = true; v.playsInline = true; v.setAttribute('playsinline', ''); v.preload = 'auto';
    v.onloadeddata = () => { const t = Math.min(1, (isFinite(v.duration) ? v.duration : 2) / 3); try { v.currentTime = t; } catch(_){ finish({blob:null, dur:v.duration || 0}); } };
    v.onseeked = async () => {
      try { finish({blob: await canvasBlob(drawScaled(v, v.videoWidth, v.videoHeight, 360), 0.72), dur: v.duration || 0}); }
      catch(_){ finish({blob:null, dur: v.duration || 0}); }
    };
    v.onerror = () => finish({blob:null, dur:0});
    v.src = url;
  });
}

const isImageFile = f => /^image\//.test(f.type || '') || /\.(jpe?g|png|heic|heif|gif|webp)$/i.test(f.name || '');
async function addRoundMedia(files, roundId){
  if(ui.addingMedia || !files.length) return;
  const r = data.rounds.find(x => x.id === roundId); if(!r) return;
  ui.addingMedia = true; expireUndo();
  let added = 0, failed = 0; const big = [], odd = [];
  try {
    for(let i = 0; i < files.length; i++){
      const f = files[i], id = uid();
      toast(files.length > 1 ? `Adding ${i + 1} of ${files.length}…` : 'Adding…', 60000);
      try {
        if(isVideoFile(f)){
          if(f.size > MAX_VIDEO_MB * 1048576){ big.push(`${f.name || 'video'} (${Math.round(f.size / 1048576)} MB)`); continue; }
          const p = await videoPoster(f);
          await mediaPut(id, f);
          if(p.blob){ await mediaPut(id + ':t', p.blob); mediaThumbs.set(id, URL.createObjectURL(p.blob)); }
          r.media.push({id, kind:'video', addedAt:Date.now(), dur:Math.round(p.dur || 0)});
        } else if(isImageFile(f)){
          const j = await photoToJpegs(f);
          await mediaPut(id, j.full); await mediaPut(id + ':t', j.thumb);
          mediaThumbs.set(id, URL.createObjectURL(j.thumb));
          r.media.push({id, kind:'photo', addedAt:Date.now()});
        } else { odd.push(f.name || 'file'); continue; }
        added++;
      } catch(e){ failed++; await mediaDel(id); }
    }
  } finally { ui.addingMedia = false; }
  if(added){ r.updatedAt = Date.now(); save(); }
  refreshMediaViews(r.id); render();
  toast(added ? `Added ${plural(added, 'item')}` : 'Nothing added', 1800);
  const notes = [];
  if(big.length) notes.push(`Too big to add (limit ${MAX_VIDEO_MB} MB per video): ${big.map(esc).join(', ')}. Trim the clip in Photos first.`);
  if(odd.length) notes.push(`Not a photo or video: ${odd.map(esc).join(', ')}.`);
  if(failed) notes.push(`${plural(failed, 'file')} could not be stored on this phone. It may be full.`);
  if(notes.length) alertBox(notes.join('<br><br>'));
}
const fmtDur = s => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
function mediaCounts(r){
  const v = r.media.filter(m => m.kind === 'video').length, ph = r.media.length - v;
  return [ph ? plural(ph, 'photo') : '', v ? plural(v, 'video') : ''].filter(Boolean).join(', ');
}
function mediaSection(r, from){
  const grid = r.media.length ? `<div class="mgrid">${r.media.map(m => {
    const t = mediaThumbs.get(m.id);
    return `<button class="mtile" data-action="viewMedia" data-id="${r.id}" data-m="${m.id}" aria-label="${m.kind === 'video' ? 'Play video' : 'View photo'}">${t ? `<img src="${t}" alt="">` : `<span class="mph">${m.kind === 'video' ? 'Video' : 'Photo'}</span>`}${m.kind === 'video' ? `<span class="vbadge">▶${m.dur ? ' ' + fmtDur(m.dur) : ''}</span>` : ''}</button>`;
  }).join('')}</div>` : '<div class="small muted">No photos or videos from this round yet.</div>';
  return `<div class="card" id="mediaCard"><div class="stat-head"><h3>Photos &amp; videos</h3><span class="n">${mediaCounts(r)}</span></div>
    ${grid}
    <button class="btn block" style="margin-top:10px" data-action="addMedia" data-id="${r.id}" data-from="${from}">＋ Add photos or videos</button>
    <div class="note">Take them now, or pick from Photos. Photos are included in backups; videos aren't (too big), so keep the originals in your Photos app.</div></div>`;
}
function openMediaSheet(id){

}
function refreshMediaViews(id){
  if(!$('#sheet').classList.contains('show')) return;
  if(ui.mediaFrom === 'detail') openRoundDetail(id); else if(ui.mediaFrom === 'sheet') openMediaSheet(id);
}
async function prunePhotos(){
  // keep photos used now or by the undo-restore copy
  const used = photoIdsIn(data);
  if(undoState && undoState.kind === 'round'){ try { photoIdsIn({rounds:[JSON.parse(undoState.json)]}).forEach(i => used.add(i)); } catch(_){} }
  try { const prev = JSON.parse(localStorage.getItem(PREV_KEY) || 'null'); photoIdsIn(prev).forEach(i => used.add(i)); } catch(_){}
  for(const k of Array.from(photoCache.keys())) if(!used.has(k)) await photoDel(k);
  const usedM = mediaIdsIn(data);
  if(undoState && undoState.kind === 'round'){ try { mediaIdsIn({rounds:[JSON.parse(undoState.json)]}).forEach(i => usedM.add(i)); } catch(_){} }
  try { mediaIdsIn(JSON.parse(localStorage.getItem(PREV_KEY) || 'null')).forEach(i => usedM.add(i)); } catch(_){}
  let keys = []; try { keys = (await idbReq('readonly', st => st.getAllKeys(), MEDIA_STORE)) || []; } catch(_){}
  for(const k of keys){ const id = String(k).replace(/:t$/, ''); if(!usedM.has(id)) await mediaDel(id); }
}

function shapeOrder(){ return data.settings.hand === 'L' ? SHAPES.slice().reverse() : SHAPES; }
function leftShapes(){ return data.settings.hand === 'L' ? ['fade','slice'] : ['hook','draw']; }
function rightShapes(){ return data.settings.hand === 'L' ? ['hook','draw'] : ['fade','slice']; }

/* ---------- tallies ---------- */
function tally(shots, cleanOnly){
  const t = {balls:0, shapeN:0, shape:{}, strike:{}, putt:{}, putts:0, line:{pull:0, push:0}, res:{}, resN:0, gir:{y:0, n:0}, girN:0, dN:0, dSum:0, dMax:0, pdN:0, pdSum:0, pdMax:0};
  RESULTS.forEach(r => t.res[r] = 0);
  SHAPES.forEach(s => t.shape[s] = 0); STRIKES.forEach(s => t.strike[s] = 0); PUTTS.forEach(s => t.putt[s] = 0);
  shots.forEach(x => {
    if(isPutt(x.c)){ t.putts++; t.putt[x.s]++; if(x.d){ t.pdN++; t.pdSum += x.d; t.pdMax = Math.max(t.pdMax, x.d); } return; }
    if(x.d){ t.dN++; t.dSum += x.d; t.dMax = Math.max(t.dMax, x.d); }
    t.balls++; t.strike[x.k]++;
    if(x.r){ t.resN++; t.res[x.r]++; }
    if(x.g){ t.girN++; t.gir[x.g]++; }
    if(!cleanOnly || x.k === 'clean'){ t.shapeN++; t.shape[x.s]++; if(x.l) t.line[x.l]++; }
  });
  return t;
}

/* ---------- rendering helpers ---------- */
function segBar(t){
  if(!t.shapeN) return '<div class="seg empty" aria-label="No balls yet"></div>';
  const order = shapeOrder();
  const label = order.map(s => `${SHAPE_LABEL[s]} ${t.shape[s]} (${pct(t.shape[s], t.shapeN)}%)`).join(', ');
  return `<div class="seg" role="img" aria-label="${esc(label)}">` + order.map(s => {
    const v = t.shape[s]; if(!v) return '';
    const p = pct(v, t.shapeN);
    return `<div class="seg-part s-${s}" style="flex:${v} 1 0" title="${SHAPE_LABEL[s]}: ${v} (${p}%)">${p >= 12 ? `<span>${p}%</span>` : ''}</div>`;
  }).join('') + '</div>';
}
function legend(t){
  return '<div class="legend">' + shapeOrder().map(s =>
    `<span class="k"><i class="sw ${s}"></i>${SHAPE_LABEL[s]} <b>${t.shape[s]}</b>${t.shapeN ? ' · ' + pct(t.shape[s], t.shapeN) + '%' : ''}</span>`
  ).join('') + '</div>' + lineLine(t) + resultLine(t) + girLine(t);
}
function girLine(t){
  if(!t.girN) return '';
  return `<div class="strike"><span class="lbl">GIR:</span> Yes ${t.gir.y} (${pct(t.gir.y, t.girN)}%) · No ${t.gir.n} (${pct(t.gir.n, t.girN)}%) <span class="muted">— ${t.girN} marked</span></div>`;
}
const fmtM = v => (Math.round(v * 10) / 10).toString().replace(/\.0$/, '');
function distLine(t){
  let h = '';
  if(t.dN) h += `<div class="strike"><span class="lbl">Distance:</span> avg ${Math.round(t.dSum / t.dN)} m · longest ${fmtM(t.dMax)} m <span class="muted">— ${t.dN} measured</span></div>`;
  if(t.pdN) h += `<div class="strike"><span class="lbl">Putt length:</span> avg ${fmtM(t.pdSum / t.pdN)} m · longest ${fmtM(t.pdMax)} m <span class="muted">— ${t.pdN} measured</span></div>`;
  return h;
}
function parseDist(txt){
  const v = (txt || '').trim().replace(',', '.');
  if(!v) return {ok:true, v:null};
  if(!/^\d{1,3}(\.\d)?$/.test(v)) return {ok:false};
  const n = parseFloat(v);
  return n > 0 && n <= 450 ? {ok:true, v:n} : {ok:false};
}
function fairwayPct(t){
  // fairway % ignores shots marked Green (those are approaches, not tee shots)
  const n = t.resN - t.res.green;
  return n ? pct(t.res.fairway, n) + '%' : '–';
}
function resultLine(t){
  if(!t.resN) return '';
  return `<div class="strike"><span class="lbl">Result:</span> ` + RESULTS.map(r => `${RESULT_SHORT[r]} ${t.res[r]} (${pct(t.res[r], t.resN)}%)`).join(' · ') + ` <span class="muted">— ${t.resN} marked</span></div>`;
}
function lineLine(t){
  if(!t.shapeN) return '';
  const pl = t.line.pull, pu = t.line.push, none = t.shapeN - pl - pu;
  return `<div class="strike"><span class="lbl">Start line:</span> Pull ${pl} (${pct(pl, t.shapeN)}%) · Push ${pu} (${pct(pu, t.shapeN)}%) · Neither ${pct(none, t.shapeN)}%</div>`;
}
function lineOrder(){ return data.settings.hand === 'L' ? ['push','pull'] : ['pull','push']; }
function shotLabel(x){
  if(isPutt(x.c)) return PUTT_LABEL[x.s];
  let l = x.l ? (x.s === 'straight' ? 'Straight ' + x.l : LINE_LABEL[x.l] + ' ' + x.s) : SHAPE_LABEL[x.s];
  if(x.k && x.k !== 'clean') l += ' · ' + STRIKE_LABEL[x.k];
  if(x.r) l += ' · ' + RESULT_LABEL[x.r];
  if(x.g) l += ' · ' + GIR_LABEL[x.g];
  if(x.d) l += ' · ' + fmtM(x.d) + ' m';
  return l;
}
function dirBlock(t){
  if(!t.shapeN) return '';
  const L = leftShapes().reduce((a, s) => a + t.shape[s], 0);
  const R = rightShapes().reduce((a, s) => a + t.shape[s], 0);
  const S = t.shape.straight;
  return `<div class="dir">
    <div><div class="v">${pct(L, t.shapeN)}%</div><div class="l">Curves left</div></div>
    <div><div class="v">${pct(S, t.shapeN)}%</div><div class="l">Straight</div></div>
    <div><div class="v">${pct(R, t.shapeN)}%</div><div class="l">Curves right</div></div>
  </div>`;
}
function likely(t){
  if(!t.shapeN) return '';
  let best = SHAPES[0];
  SHAPES.forEach(s => { if(t.shape[s] > t.shape[best]) best = s; });
  return `Most likely flight: <b>${SHAPE_LABEL[best]}</b> (${pct(t.shape[best], t.shapeN)}%)`;
}
function strikeLine(t){
  if(!t.balls) return '';
  return `<div class="strike">Strike: <b>Clean ${pct(t.strike.clean, t.balls)}%</b> · ` +
    ['chunk','thin','topped'].map(k => `${STRIKE_LABEL[k]} ${t.strike[k]} (${pct(t.strike[k], t.balls)}%)`).join(' · ') +
    '</div>';
}
function sampleNote(n){
  return n && n < 30 ? `<div class="note">Small sample (${n} shots) — treat the % as rough until you've logged 30+.</div>` : '';
}
function puttBlock(t){
  if(!t.putts) return '<div class="muted small">No putts logged.</div>';
  return `<div class="putt-grid">` + PUTTS.map(p =>
    `<div><div class="v">${pct(t.putt[p], t.putts)}%</div><div class="l">${PUTT_SHORT[p]} · ${t.putt[p]}</div></div>`
  ).join('') + '</div>';
}

const MAP_W = 2400, mercY = lat => Math.log(Math.tan(Math.PI / 4 + Math.max(-85, Math.min(85, lat)) * Math.PI / 360));
const MAP_TOP = mercY(80), pjx = lon => (lon + 180) * MAP_W / 360, pjy = lat => (MAP_TOP - mercY(lat)) * MAP_W / (2 * Math.PI);
let worldArcs = null, worldLandD = '', worldKey = '';
function worldDecode(){
  if(worldArcs) return worldArcs;
  const A = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_', L = {};
  for(let i = 0; i < 64; i++) L[A[i]] = i;
  const [sx, sy] = WORLD.t.scale, [tx, ty] = WORLD.t.translate;
  worldArcs = WORLD.arcs.split('|').map(str => {
    const pts = []; let v = 0, mul = 1, x = 0, y = 0, n = 0;
    for(let i = 0; i < str.length; i++){
      const d = L[str[i]]; v += (d & 31) * mul;
      if(d & 32){ mul *= 32; continue; }
      const val = v % 2 ? -(v + 1) / 2 : v / 2; v = 0; mul = 1;
      if(n++ % 2 === 0) x += val; else { y += val; pts.push([pjx(x * sx + tx), pjy(y * sy + ty)]); }
    }
    return pts;
  });
  return worldArcs;
}
function ringD(ring){
  // Shapes that cross the date line (Russia, Fiji) are kept whole: when a step jumps across the map, carry on past the
  // edge instead of drawing a line back across the world, then draw a shifted copy so the far side shows too.
  const arcs = worldDecode(), xs = [], ys = [];
  let off = 0, prev = null;
  ring.forEach((i, k) => {
    const a = i < 0 ? arcs[~i] : arcs[i], n = a.length;
    for(let j = k ? 1 : 0; j < n; j++){
      const p = i < 0 ? a[n - 1 - j] : a[j];
      if(prev !== null){ const dx = p[0] - prev; if(dx > MAP_W / 2) off -= MAP_W; else if(dx < -MAP_W / 2) off += MAP_W; }
      prev = p[0]; xs.push(p[0] + off); ys.push(p[1]);
    }
  });
  if(!xs.length) return '';
  const path = shift => 'M' + xs.map((x, j) => (x + shift).toFixed(1) + ',' + ys[j].toFixed(1)).join('L') + 'Z';
  let d = path(0);
  if(Math.max(...xs) > MAP_W) d += path(-MAP_W);
  if(Math.min(...xs) < 0) d += path(MAP_W);
  return d;
}
const polysD = polys => polys.map(poly => poly.map(ringD).join('')).join('');
const countryName = id => WORLD.countries[id] ? WORLD.countries[id][0] : id;
const playedIds = () => (data.profile.countries || []).filter(id => WORLD.countries[id]);
function renderWorldMap(force){
  const svg = $('#worldBg'); if(!svg) return;
  const r = svg.getBoundingClientRect(); if(!r.width || !r.height) return;
  const ids = playedIds(), key = ids.join(',') + '|' + Math.round(r.width) + 'x' + Math.round(r.height);
  if(key === worldKey && !force) return;
  worldKey = key;
  if(!worldLandD){ worldLandD = polysD(WORLD.land); svg.innerHTML = `<path class="wland" d="${worldLandD}"/><g id="wPlayed"></g>`; }
  // frame: Africa + Europe, plus every country played (its main landmass), with a little margin
  const box = b => [pjx(b[0]), pjy(Math.min(b[3], 75)), pjx(b[2]), pjy(Math.max(b[1], -56))];
  let f = box([-25.5, -35.6, 54.5, 71.6]);
  ids.forEach(id => { const b = box(WORLD.countries[id][2]); f = [Math.min(f[0], b[0]), Math.min(f[1], b[1]), Math.max(f[2], b[2]), Math.max(f[3], b[3])]; });
  let w = f[2] - f[0], h = f[3] - f[1];
  if(ids.length){ f = [f[0] - w * .04, f[1] - h * .04, f[2] + w * .04, f[3] + h * .04]; w *= 1.08; h *= 1.08; }
  const asp = r.width / r.height;
  if(w / h < asp){ const nw = h * asp; f[0] -= (nw - w) / 2; w = nw; } else { const nh = w / asp; f[1] -= (nh - h) / 2; h = nh; }
  svg.setAttribute('viewBox', `${f[0].toFixed(1)} ${f[1].toFixed(1)} ${w.toFixed(1)} ${h.toFixed(1)}`);
  const unit = w / r.width;   // map units per screen pixel, so dots stay the same size at any zoom
  $('#wPlayed').innerHTML = ids.map(id => WORLD.countries[id][1] ? `<path class="wplay" d="${polysD(WORLD.countries[id][1])}"/>` : '').join('')
    + ids.map(id => { const c = WORLD.countries[id][3]; return `<circle class="wdot" cx="${pjx(c[0]).toFixed(1)}" cy="${pjy(c[1]).toFixed(1)}" r="${(3.4 * unit).toFixed(2)}"><title>${esc(countryName(id))}</title></circle>`; }).join('');
}

const DEFAULT_DIST = {driver:220, wood:200, hybrid:180, wedge:90, putter:3};
const IRON_DIST = {2:190, 3:180, 4:170, 5:160, 6:150, 7:140, 8:130, 9:120};
function distBaseline(c){
  // your average on the course with this club, else a sensible starting point
  const ds = data.rounds.flatMap(r => r.shots).filter(x => x.c === c.id && x.d).map(x => x.d);
  const step = c.type === 'putter' ? 0.5 : 5;
  if(ds.length) return Math.round(ds.reduce((a, b) => a + b, 0) / ds.length / step) * step;
  const n = (c.name.match(/\d+/) || [])[0];
  if(c.type === 'iron' && IRON_DIST[n]) return IRON_DIST[n];
  if(c.type === 'wedge' && n && +n >= 46) return Math.max(50, 230 - +n * 2.5);
  return DEFAULT_DIST[c.type] || 150;
}

function waterPenalty(s, h, before, after){
  if(s.mode !== 'holes' || !h || before === after) return;
  if(after === 'water') s.pen[h] = (s.pen[h] || 0) + 1;
  else if(before === 'water' && s.pen[h]){ s.pen[h]--; if(!s.pen[h]) delete s.pen[h]; }
}

function moveHole(dir){
  const r = activeRound(); if(!r) return;
  const list = holeList(r), idx = list.indexOf(r.cur), next = idx + dir;
  if(next < 0) return;
  if(next >= list.length){ rememberPars(r); save(false); openRoundSheet(r.id, 'finish'); return; }
  r.cur = list[next]; ensurePar(r, r.cur);
  // new hole: tee off with the driver on a par 4/5
  const dr = activeClubs().find(c => c.type === 'driver');
  if(dr && r.par[r.cur] >= 4) data.settings.lastRoundClub = dr.id;

  setTimeout(() => {
    if(activeRound() !== r || !holeInfo(r, r.cur).holed) return;   // undone before we moved on
    if(undoState) undoState.undone = `Back on hole ${r.cur}`;
    toast(last ? msg + ' — last hole' : msg + ` — on to hole ${list[list.indexOf(r.cur) + 1]}`, 5000, true);

function statsEvents(){

  const ev = [];

function metricTile(value, label, pctVal, sub){
  return `<div class="mt"><div class="mv">${value}</div><div class="ml">${label}</div>${pctVal !== null && pctVal !== undefined ? `<div class="mbar"><i style="width:${Math.max(0, Math.min(100, pctVal))}%"></i></div>` : ''}${sub ? `<div class="ms">${sub}</div>` : ''}</div>`;
}
function metricGrid(t, tAll){
  const tiles = [];
  if(tAll.balls) tiles.push(metricTile(pct(tAll.strike.clean, tAll.balls) + '%', 'Clean strikes', pct(tAll.strike.clean, tAll.balls),
    ['chunk','thin','topped'].filter(k => tAll.strike[k]).map(k => `${STRIKE_LABEL[k]} ${pct(tAll.strike[k], tAll.balls)}%`).join(' · ')));
  if(t.shapeN){
    tiles.push(metricTile(pct(t.line.pull, t.shapeN) + '%', 'Pull', pct(t.line.pull, t.shapeN)));
    tiles.push(metricTile(pct(t.line.push, t.shapeN) + '%', 'Push', pct(t.line.push, t.shapeN)));
  }
  const fwMarked = tAll.resN - tAll.res.green;
  if(tAll.res.fairway || (fwMarked && tAll.res.green === 0)) tiles.push(metricTile(pct(tAll.res.fairway, fwMarked) + '%', 'Fairway', pct(tAll.res.fairway, fwMarked), `${fwMarked} marked`));
  const grMarked = tAll.resN - tAll.res.fairway;
  if(tAll.res.green) tiles.push(metricTile(pct(tAll.res.green, grMarked) + '%', 'Green hit', pct(tAll.res.green, grMarked), `${grMarked} marked`));
  if(t.dN) tiles.push(metricTile(Math.round(t.dSum / t.dN) + ' m', 'Avg distance', null, `longest ${fmtM(t.dMax)} m · ${t.dN} measured`));
  return tiles.length ? `<div class="mgrid">${tiles.join('')}</div>` : '';
}

function autoShort(name, type){
  const t = name.trim(); let m;
  if(type === 'driver') return 'Dr';
  if(type === 'putter') return 'Putt';
  if((m = t.match(/(\d+)\s*°/))) return m[1] + '°';
  if((m = t.match(/^(\d+)/))) return m[1] + ({wood:'W', hybrid:'H', iron:'i', wedge:'°'}[type] || '');
  const words = t.split(/\s+/).filter(Boolean);
  if(words.length > 1) return words.map(w => w[0].toUpperCase()).join('').slice(0, 3);
  return t.slice(0, 4);
}

function insertIndex(type, name){
  // numbered clubs slot in by number (new 7 Iron goes before the 8 Iron, 56° before 60°)
  const num = x => { const m = String(x).match(/(\d+)/); return m ? +m[1] : null; };
  const ti = TYPE_ORDER.indexOf(type), nn = num(name);
  if(nn !== null){
    const i = data.bag.findIndex(c => c.type === type && num(c.name) !== null && num(c.name) > nn);
    if(i >= 0) return i;
  }
  for(let i = data.bag.length - 1; i >= 0; i--) if(TYPE_ORDER.indexOf(data.bag[i].type) <= ti) return i + 1;
  return 0;
}

async function processPhoto(file){
  // centre-crop to a square and shrink to 256 px so it stays small in storage and backups
  let url;
  try {
    url = URL.createObjectURL(file);
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const S = 256, side = Math.min(img.naturalWidth, img.naturalHeight);
    const c = document.createElement('canvas'); c.width = c.height = S;
    c.getContext('2d').drawImage(img, (img.naturalWidth - side) / 2, (img.naturalHeight - side) / 2, side, side, 0, 0, S, S);
    ui.pendingPhoto = c.toDataURL('image/jpeg', 0.85);
    const av = $('#pAvatar'); if(av) av.innerHTML = avatarInner(ui.pendingPhoto);
    const pb = $('#pPhotoBtns'); if(pb) pb.innerHTML = photoButtons(true);
  } catch(e){
    alertBox('That photo could not be read. Try a different one.');
  } finally { if(url) URL.revokeObjectURL(url); }
}
function parseHcp(txt){
  const t = txt.trim().replace(',', '.');
  if(!t) return {ok:true, v:null};
  const m = t.match(/^([+-]?)(\d{1,2}(\.\d)?)$/);
  if(!m) return {ok:false};
  let v = parseFloat(m[2]);
  if(m[1] === '+') v = -v;                // plus handicaps stored as negative
  if(v < -10 || v > 54) return {ok:false};
  return {ok:true, v};
}
function clubTable(cid, ev){
  const rows = ev.map(e => ({e, shots:e.shots.filter(x => x.c === cid)})).filter(r => r.shots.length).reverse();

  if(isPutt(cid)){

      rows.map(r => { const t = tally(r.shots); return `<tr><td>${when(r.e)}</td><td>${t.putts}</td>${PUTTS.map(p => `<td>${pct(t.putt[p], t.putts)}%</td>`).join('')}</tr>`; }).join('') + '</tbody></table>' + key;
  }
  const order = shapeOrder();
  return `<table class="tbl"><thead><tr><th>Date</th><th>Shots</th>${order.map(s => `<th><i class="sw ${s}"></i> ${s === 'straight' ? 'Str' : SHAPE_LABEL[s]}</th>`).join('')}<th>Pull</th><th>Push</th><th>Mis</th></tr></thead><tbody>` +
    rows.map(r => {
      const t = tally(r.shots, ui.cleanOnly), tAll = tally(r.shots);
      return `<tr><td>${when(r.e)}</td><td>${tAll.balls}</td>${order.map(s => `<td>${t.shapeN ? pct(t.shape[s], t.shapeN) + '%' : '–'}</td>`).join('')}<td>${t.shapeN ? pct(t.line.pull, t.shapeN) + '%' : '–'}</td><td>${t.shapeN ? pct(t.line.push, t.shapeN) + '%' : '–'}</td><td>${pct(tAll.balls - tAll.strike.clean, tAll.balls)}%</td></tr>`;
    }).join('') + '</tbody></table>' + key;
}

async function processCardPhoto(file, side){
  if(isPdfFile(file)){
    // scans are kept exactly as scanned (all pages)
    if(file.size > MAX_SCAN_MB * 1048576) return alertBox(`That scan is ${(file.size / 1048576).toFixed(1)} MB. The limit is ${MAX_SCAN_MB} MB, so try scanning one side of the card at a time.`);
    try {
      const u = await new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = () => rej(fr.error); fr.readAsDataURL(file); });
      if(typeof u !== 'string' || !u.startsWith('data:application/pdf')) throw new Error('not a pdf');
      ui.cardPending[side] = u; refreshCardTiles();
    } catch(e){ alertBox('That scan could not be read. Try saving it again as a PDF, or take a photo instead.'); }
    return;
  }
  // photos and image scans: keep readable, longest side 1600 px, JPEG
  let url;
  try {
    url = URL.createObjectURL(file);
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const max = 1600, k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const w = Math.round(img.naturalWidth * k), h = Math.round(img.naturalHeight * k);
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    c.getContext('2d').drawImage(img, 0, 0, w, h);
    ui.cardPending[side] = c.toDataURL('image/jpeg', 0.78);
    refreshCardTiles();
  } catch(e){ alertBox('That file could not be read. Use a photo (JPEG or PNG) or a PDF scan.'); }
  finally { if(url) URL.revokeObjectURL(url); }
}

function scorecardTable(r, edit){
  // a scorecard built from the pars you set: Out (1-9), In (10-18) and Total, in the order the holes were played
  const rows = holeList(r).map(h => holeInfo(r, h));
  const mk = v => v === null ? '' : (v ? '✓' : '·');
  const sum = (a, f) => a.reduce((n, x) => n + (f(x) || 0), 0);
  const tone = x => x.score !== null && x.par ? (x.score < x.par ? 'under' : x.score > x.par ? 'over' : '') : '';
  const parCell = x => edit
    ? `<div class="pmini">${[3, 4, 5].map(v => `<button class="${x.par === v ? 'on' : ''}" data-action="cardPar" data-h="${x.h}" data-v="${v}" aria-label="Hole ${x.h} par ${v}" aria-pressed="${x.par === v}">${v}</button>`).join('')}</div>`
    : (x.par ?? '');
  const row = x => `<tr class="${edit && x.h === r.cur ? 'curh' : ''}"><td>${edit ? `<button class="hjump" data-action="cardHole" data-h="${x.h}" aria-label="Go to hole ${x.h}">${x.h}</button>` : x.h}</td><td>${parCell(x)}</td><td class="${tone(x)}">${x.score ?? ''}</td><td>${x.score !== null ? x.putts : ''}</td><td>${mk(x.fir)}</td><td>${mk(x.gir)}</td></tr>`;
  const sub = (lbl, a) => {
    const pl = a.filter(x => x.score !== null), tp = sum(pl.filter(x => x.par), x => x.score - x.par);
    const fr = a.filter(x => x.fir !== null), gr = a.filter(x => x.gir !== null);
    return `<tr class="tot"><td>${lbl}</td><td>${a.every(x => x.par) ? sum(a, x => x.par) : ''}</td><td>${pl.length ? `${sum(pl, x => x.score)}<span class="tp">${fmtToPar(tp)}</span>` : ''}</td><td>${pl.length ? sum(pl, x => x.putts) : ''}</td><td>${fr.length ? `${fr.filter(x => x.fir).length}/${fr.length}` : ''}</td><td>${gr.length ? `${gr.filter(x => x.gir).length}/${gr.length}` : ''}</td></tr>`;
  };
  let body = '';
  rows.forEach(x => {
    body += row(x);
    if(r.holes === 18 && x.h === 9) body += sub('Out', rows.filter(y => y.h <= 9));
    if(r.holes === 18 && x.h === 18) body += sub('In', rows.filter(y => y.h >= 10));
  });
  body += sub('Total', rows);
  return `<table class="tbl sc-tbl ${edit ? 'edit' : ''}"><thead><tr><th>Hole</th><th>Par</th><th>Score</th><th>Putts</th><th>FIR</th><th>GIR</th></tr></thead><tbody>${body}</tbody></table>`;
}

    ${CARD_SIDES.some(k => r.photos[k]) ? `<div class="cards3" style="margin-bottom:12px">${thumbs}</div>` : '<div class="small muted" style="margin-bottom:10px">No scorecard added. Use Edit below to add the cover, front or back.</div>'}
    ${r.mode === 'holes' ? `<div class="card"><h3>Scorecard</h3>${scorecardTable(r)}</div>` : ''}
    ${mediaSection(r, 'detail')}
    ${t.balls ? `<div class="card"><div class="stat-head"><h3>All shots</h3><span class="n">${plural(t.balls, 'shot')}${t.putts ? ' · ' + plural(t.putts, 'putt') : ''}</span></div>${segBar(t)}${legend(t)}${strikeLine(t)}</div>` + perClub
      : (t.putts ? perClub : '<div class="small muted" style="margin-bottom:10px">No shots logged for this round.</div>')}

function backupName(){
  const d = new Date(), p = n => String(n).padStart(2, '0');
  return `golf-tracker-backup_v${APP_VERSION}_${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}.json`;
}
function backupCore(){
  const photos = {};
  photoIdsIn(data).forEach(id => { const u = photoCache.get(id); if(u) photos[id] = u; });
  return {app:APP_ID, schema:SCHEMA, appVersion:APP_VERSION, exportedAt:new Date().toISOString(), data, photos};
}
const hasRoundMedia = () => data.rounds.some(r => r.media.length);
async function backupJSON(){
  const b = backupCore(), media = {};
  for(const r of data.rounds) for(const m of r.media){
    for(const k of (m.kind === 'photo' ? [m.id, m.id + ':t'] : [m.id + ':t'])){
      let bl = null; try { bl = await mediaGet(k); } catch(_){}
      if(bl) media[k] = await blobToDataUrl(bl);
    }
  }
  b.media = media;
  return JSON.stringify(b);
}
// iPhone only opens the share sheet straight after a tap, so a backup with round photos is built ahead of time on the Settings tab
let preparedBackup = null, preparingBackup = false;
async function prepareBackup(){
  if(preparingBackup || !hasRoundMedia() || (preparedBackup && preparedBackup.stamp === data.meta.updatedAt)) return;
  preparingBackup = true;
  try { const stamp = data.meta.updatedAt, json = await backupJSON(); if(stamp === data.meta.updatedAt) preparedBackup = {stamp, json}; }
  catch(_){} finally { preparingBackup = false; }
}
function markBackedUp(){
  data.meta.lastBackupAt = Date.now();
  data.meta.changesSinceBackup = 0;
  save(false);
  render();
}
function downloadFile(json, name){
  const blob = new Blob([json], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name; a.rel = 'noopener';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}
async function doBackup(forceDownload){
  if(!photosLoaded && photoIdsIn(data).size && !photoStoreError) return alertBox('Scorecard photos are still loading. Try again in a moment.');
  let json;
  if(!hasRoundMedia()) json = JSON.stringify(backupCore());
  else if(preparedBackup && preparedBackup.stamp === data.meta.updatedAt) json = preparedBackup.json;
  else {
    toast('Preparing backup…', 60000);
    json = await backupJSON();
    toast('Backup ready', 1200);
    if(!forceDownload && navigator.canShare){
      const ok = await confirmBox('Backup ready', `${(json.length / 1048576).toFixed(1)} MB, including your round photos.`, 'Save backup');
      if(!ok) return;
    }
  }
  const name = backupName();
  let file = null;
  try { file = new File([json], name, {type:'application/json'}); } catch(_){}
  if(!forceDownload && file && navigator.canShare && navigator.canShare({files:[file]})){
    try {
      await navigator.share({files:[file], title:'Golf Tracker backup'});
      markBackedUp(); toast('Backup saved');
      return;
    } catch(e){
      if(e && e.name === 'AbortError'){ toast('Backup cancelled — nothing saved'); return; }
      // share failed for another reason: fall back to download
    }
  }
  downloadFile(json, name);
  markBackedUp();
  toast('Backup downloaded — check your Downloads');
}

function readBackupObject(obj){
  if(!obj || typeof obj !== 'object') return null;
  if(obj.app === APP_ID && obj.data) return obj.data;
  if(obj.app === APP_ID && Array.isArray(obj.sessions)) return obj; // raw data object
  return null;
}
async function handleRestoreFile(file){
  expireUndo();
  let text;
  try { text = await file.text(); } catch(e){ return alertBox('Could not read that file.'); }
  let obj; try { obj = JSON.parse(text); } catch(e){ return alertBox('That is not a Golf Tracker backup file (could not read it).'); }
  const raw = readBackupObject(obj);
  if(!raw) return alertBox('That file is not a Golf Tracker backup.');
  const incoming = normalise(raw);
  const balls = incoming.sessions.concat(incoming.rounds).reduce((a, s) => a + s.shots.length, 0);
  const when = obj.exportedAt ? fmtDate(Date.parse(obj.exportedAt)) + ' ' + fmtTime(Date.parse(obj.exportedAt)) : 'unknown date';
  const curBalls = data.sessions.concat(data.rounds).reduce((a, s) => a + s.shots.length, 0);
  const inPhotos = obj.photos && typeof obj.photos === 'object' ? obj.photos : {};
  const choice = await choose(`Restore this backup?`,
    `Backup from <b>${esc(when)}</b>${obj.appVersion ? ' (app v' + esc(obj.appVersion) + ')' : ''}: <b>${incoming.sessions.length}</b> sessions, <b>${balls}</b> shots, <b>${incoming.rounds.length}</b> rounds.<br><br>This device has ${data.sessions.length} sessions, ${curBalls} shots, ${data.rounds.length} rounds.`,
    [{id:'replace', label:'Replace everything with the backup', cls:'primary'},
     {id:'merge', label:'Merge (keep both, no duplicates)'},
     {id:'cancel', label:'Cancel', cls:'ghost'}]);
  if(choice === 'cancel' || !choice) return;
  try { localStorage.setItem(PREV_KEY, JSON.stringify(data)); } catch(_){}
  let photoFail = 0;
  for(const [pid, url] of Object.entries(inPhotos)){
    if(typeof url !== 'string' || !/^data:(image\/|application\/pdf)/.test(url) || photoCache.get(pid) === url) continue;
    try { await photoPut(pid, url); } catch(e){ photoFail++; }
  }
  const inMedia = obj.media && typeof obj.media === 'object' ? obj.media : {};
  for(const [k, url] of Object.entries(inMedia)){
    if(typeof url !== 'string' || !/^[\w-]+(:t)?$/.test(k) || !/^data:(image|video)\//.test(url)) continue;
    try { await mediaPut(k, dataUrlToBlob(url)); } catch(e){ photoFail++; }
  }
  if(choice === 'replace'){
    const keep = {settings: data.settings};
    data = incoming;
    data.settings = Object.assign({}, incoming.settings, {hideHomeTip: keep.settings.hideHomeTip});
  } else {
    const byId = new Map(data.sessions.map(s => [s.id, s]));
    incoming.sessions.forEach(s => {
      const mine = byId.get(s.id);
      if(!mine) byId.set(s.id, s);
      else if(s.shots.length > mine.shots.length || (s.shots.length === mine.shots.length && s.updatedAt > mine.updatedAt)) byId.set(s.id, s);
    });
    const bagIds = new Set(data.bag.map(c => c.id));
    incoming.bag.forEach(c => { if(!bagIds.has(c.id)) data.bag.push(c); });
    const p = data.profile, ip = incoming.profile;
    ['name','surname','photo','homeCourse','bestScoreCourse','bestScoreDate'].forEach(k => { if(!p[k] && ip[k]) p[k] = ip[k]; });
    if(p.handicap === null && ip.handicap !== null) p.handicap = ip.handicap;
    if(p.bestScore === null && ip.bestScore !== null) p.bestScore = ip.bestScore;
    const hd = new Set(p.handicapHistory.map(x => x.d));
    ip.handicapHistory.forEach(x => { if(!hd.has(x.d)) p.handicapHistory.push(x); });
    p.handicapHistory.sort((a, b) => a.d - b.d);
    p.countries = Array.from(new Set(p.countries.concat(ip.countries || [])));
    const rById = new Map(data.rounds.map(r => [r.id, r]));
    incoming.rounds.forEach(r => {
      const mine = rById.get(r.id);
      if(!mine || r.shots.length > mine.shots.length || (r.shots.length === mine.shots.length && r.updatedAt > mine.updatedAt)) rById.set(r.id, r);
    });
    Object.keys(incoming.courses || {}).forEach(k => { if(!data.courses[k]) data.courses[k] = incoming.courses[k]; });
    data = normalise(Object.assign({}, data, {sessions: Array.from(byId.values()), rounds: Array.from(rById.values())}));
  }
  reviveRestored();
  data.meta.lastBackupAt = Math.max(data.meta.lastBackupAt || 0, obj.exportedAt ? Date.parse(obj.exportedAt) : 0);
  data.meta.changesSinceBackup = choice === 'merge' ? 1 : 0;
  loadError = null;
  const ok = save(false);
  render();
  toast(ok ? (choice === 'replace' ? 'Backup restored' : 'Backup merged') : 'Restore did not save!');
  if(photoFail) alertBox(`${plural(photoFail, 'photo')} could not be stored on this phone. Everything else was restored.`);
  mediaLoadThumbs().then(() => { if(!lockView) render(); }).catch(() => {});
}

/* ---------- sheet / modal / toast ---------- */
function openSheet(html){
  $('#sheetInner').innerHTML = html;
  $('#overlay').classList.add('show');
  requestAnimationFrame(() => $('#sheet').classList.add('show'));
}
function closeSheet(){
  $('#sheet').classList.remove('show');
  $('#overlay').classList.remove('show');
}
let modalResolve = null;
function choose(title, html, buttons){
  return new Promise(res => {
    modalResolve = res;
    $('#modalBox').innerHTML = `<h3>${title}</h3><p>${html}</p><div class="btns">${buttons.map(b => `<button class="btn block ${b.cls || ''}" data-action="modalChoice" data-id="${b.id}">${b.label}</button>`).join('')}</div>`;
    $('#modal').classList.add('show');
  });
}
function alertBox(msg){ return choose('Heads up', esc(msg), [{id:'ok', label:'OK', cls:'primary'}]); }
function confirmBox(title, msg, yes, danger){
  return choose(title, msg, [{id:'yes', label:yes, cls: danger ? 'danger' : 'primary'}, {id:'no', label:'Cancel', cls:'ghost'}]).then(v => v === 'yes');
}
let toastTimer;
function toast(msg, ms = 1700, withUndo = false){
  // a toast with an Undo button keeps the last change undoable until it fades
  const t = $('#toast'), act = withUndo && !!undoState;
  if(!act) expireUndo();
  t.innerHTML = `<span>${esc(msg)}</span>${act ? '<button class="tundo" data-action="undoLast">Undo</button>' : ''}`;
  t.classList.toggle('act', act); t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.classList.remove('show', 'act'); expireUndo(); }, act ? Math.max(ms, 5000) : ms);
}
/* ---------- one-step undo: a copy of the session or round from just before the last change ---------- */
let undoState = null;
const listOf = kind => kind === 'round' ? data.rounds : data.sessions;
function remember(kind, obj, opts = {}){
  if(!obj) return;
  expireUndo();
  undoState = Object.assign({kind, id: obj.id, json: JSON.stringify(obj), index: listOf(kind).indexOf(obj)}, opts);
}
function expireUndo(){
  const u = undoState; undoState = null;
  if(u && u.prune) prunePhotos();     // a deleted round's photos are only removed once Undo is gone
}
function undoLast(){
  const u = undoState; if(!u) return;
  undoState = null;
  const list = listOf(u.kind), obj = JSON.parse(u.json), i = list.findIndex(x => x.id === u.id);
  if(i >= 0) list[i] = obj; else list.splice(Math.max(0, Math.min(u.index, list.length)), 0, obj);
  delete data.deleted[u.id];
  ui.roundSheet = null; ui.edit = null; closeSheet();
  resetToggles(); save(); render();
  toast(u.undone || 'Undone');
}

/* ---------- forgotten session / round check ---------- */
const STALE_MS = 8 * 3600e3;
function lastActivity(x){ const last = x.shots.length ? x.shots[x.shots.length - 1].t : 0; return Math.max(x.startedAt || 0, last || 0, x.updatedAt || 0); }
let staleChecking = false;
async function checkStale(){
  if(staleChecking || lockView || modalResolve) return;
  staleChecking = true;
  try {
    const s = activeSession();
    if(s && Date.now() - lastActivity(s) > STALE_MS){
      const c = await choose('Range session still open', `Your range session from <b>${fmtDate(s.startedAt)}</b> was never ended. Last activity ${ago(lastActivity(s))}.`,
        [{id:'end', label:'End it now', cls:'primary'}, {id:'keep', label:'Keep going with it', cls:'ghost'}]);
      if(c === 'end'){
        if(!s.shots.length) removeSession(s);
        else { s.endedAt = lastActivity(s); s.updatedAt = Date.now(); }
        save(); render(); toast('Old session ended');
      } else { s.updatedAt = Date.now(); save(false); }
    }
    const r = activeRound();
    if(r && Date.now() - lastActivity(r) > STALE_MS){
      const c = await choose('Round still open', `Your round${r.course ? ' at <b>' + esc(r.course) + '</b>' : ''} on ${fmtISO(r.date)} was never finished. Last activity ${ago(lastActivity(r))}.`,
        [{id:'finish', label:'Finish it now', cls:'primary'}, {id:'keep', label:'Keep going with it', cls:'ghost'}]);
      if(c === 'finish'){ ui.tab = 'rounds'; render(); openRoundSheet(r.id, 'finish'); }
      else { r.updatedAt = Date.now(); save(false); }
    }
  } finally { staleChecking = false; }
}
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible' && !lockView) setTimeout(checkStale, 400); });

/* ---------- screen wake lock ---------- */
let wakeLock = null;
async function updateWakeLock(){
  // range sessions only: on the course the phone should sleep in your pocket (saves battery, no stray taps)
  const want = !!(activeSession() && ui.tab === 'range' && !lockView && data.settings.keepAwake && document.visibilityState === 'visible');
  try {
    if(want && !wakeLock && navigator.wakeLock){
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    } else if(!want && wakeLock){ await wakeLock.release(); wakeLock = null; }
  } catch(_){ wakeLock = null; }
}
document.addEventListener('visibilitychange', updateWakeLock);

/* ---------- actions ---------- */
const actions = {
  tab: el => { ui.tab = el.dataset.tab; closeSheet(); $('#viewer').classList.remove('show'); render(); window.scrollTo(0, 0); },
  start: () => {
    expireUndo();
    const now = Date.now();
    data.sessions.push({id:uid(), startedAt:now, endedAt:null, updatedAt:now, shots:[]});
    save(); render(); toast('Session started');
  },
  end: async () => {
    const s = activeSession(); if(!s) return;
    if(!s.shots.length){
      const del = await confirmBox('End session?', 'No balls were logged, so this empty session will be removed.', 'End and remove');
      if(!del) return;
      removeSession(s); save(false); render(); return;
    }
    const v = await choose('End this session?', `${plural(s.shots.length, 'shot')} logged. Keep it in your stats, or delete it if it was a test or a mistake.`,
      [{id:'yes', label:'End and keep', cls:'primary'}, {id:'del', label:'Delete session', cls:'danger'}, {id:'no', label:'Keep going', cls:'ghost'}]);
    if(v === 'del'){
      remember('session', s, {undone:'Session restored'});
      removeSession(s); save(); render(); toast('Session deleted', 8000, true);
      return;
    }
    if(v !== 'yes') return;
    expireUndo();
    s.endedAt = Date.now(); s.updatedAt = s.endedAt;
    save(); render();
    const b = await choose('Session saved ✓', 'Back up now so it\'s safe off this phone too?', [{id:'yes', label:'Back up now', cls:'primary'}, {id:'no', label:'Later', cls:'ghost'}]);
    if(b === 'yes') doBackup(false);
  },
  club: el => { data.settings[ctxClubKey(el.dataset.ctx)] = el.dataset.club; resetToggles(); save(false); render(); },
  result: el => { ui.result = ui.result === el.dataset.r ? null : el.dataset.r; $('#resultRow').innerHTML = resultButtons(); },
  gir: el => { ui.gir = ui.gir === el.dataset.g ? null : el.dataset.g; $('#girRow').innerHTML = girButtons(); },
  strike: el => { ui.strike = ui.strike === el.dataset.k ? 'clean' : el.dataset.k; $('#togRow').innerHTML = toggleChips(); },
  line: el => { ui.line = ui.line === el.dataset.l ? null : el.dataset.l; $('#togRow').innerHTML = toggleChips(); },
  shape: el => {
    const ctx = el.dataset.ctx || 'range';
    const c = ctxClub(ctx); if(!c) return;
    const sh = {c:c.id, s:el.dataset.shape, k:ui.strike};
    if(ui.line) sh.l = ui.line;
    if(ctx === 'round' && ui.result) sh.r = ui.result;
    if(ctx === 'round' && ui.gir) sh.g = ui.gir;
    if(!addDist(sh)) return;
    const r = ctx === 'round' ? activeRound() : null;
    remember(ctx === 'round' ? 'round' : 'session', ctxTarget(ctx), {undone:'Shot undone'});
    let note = '';
    if(r && r.mode === 'holes'){
      sh.h = r.cur;
      if(sh.r === 'water'){ r.pen[r.cur] = (r.pen[r.cur] || 0) + 1; note = ' · +1 penalty'; }
    }
    logShot(ctx, sh, note);
  },
  putt: el => {
    const ctx = el.dataset.ctx || 'range'; const c = ctxClub(ctx); if(!c) return;
    const pt = {c:c.id, s:el.dataset.r}; if(!addDist(pt)) return;
    const r = ctx === 'round' ? activeRound() : null;
    remember(ctx === 'round' ? 'round' : 'session', ctxTarget(ctx), {undone:'Putt undone'});
    if(r && r.mode === 'holes') pt.h = r.cur;
    logShot(ctx, pt);
    if(r && r.mode === 'holes' && pt.s === 'holed') holedOut(r);
  },
  hole: el => moveHole(+el.dataset.d),
  editShot: el => openEditShot(el.dataset.ctx, +el.dataset.t),
  eSet: el => {

  cardOnly:['cardOnly', 500], finishRound:['finishRound', 500], end:['end', 600], saveProfile:['save', 600], saveClub:['save', 600]};

  const el = e.target.closest('[data-action]');

  if(el.closest('#sheet') && !$('#sheet').classList.contains('show')) return;   // sheet is closing
  const g = TAP_GUARD[el.dataset.action];
  if(g){ const now = Date.now(); if(now - (lastTap[g[0]] || 0) < g[1]) return; lastTap[g[0]] = now; }
  fn(el);
});

   The password and codes are stored only as salted hashes, on this device.
   The login is kept separate from the app data and from backups. */
const AUTH_KEY = KEY + ':auth', SESS_KEY = KEY + ':session', AUTH_ITER = 210000;
let lockView = null, pendingCodes = null, recoverIdx = null, failCount = 0, lockUntil = 0;
const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64 = str => Uint8Array.from(atob(str), c => c.charCodeAt(0));
function randBytes(n){ const a = new Uint8Array(n); crypto.getRandomValues(a); return a; }
async function pbkdf2(pw, salt, iter){
  const key = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
  return b64(await crypto.subtle.deriveBits({name:'PBKDF2', hash:'SHA-256', salt, iterations:iter}, key, 256));
}
async function sha(str){ return b64(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str))); }
function newCodes(){
  const A = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';           // no 0/O or 1/I to mix up
  return Array.from({length:8}, () => { const r = randBytes(8); let c = ''; for(let i = 0; i < 8; i++) c += A[r[i] % 32]; return c.slice(0, 4) + '-' + c.slice(4); });
}

const authForms = {
  setup: async () => {

    if(user.length < 3) return lockErr('Username needs at least 3 characters.');

    const a = {v:1, user, createdAt:Date.now()};
    await setPassword(a, pw);

    if(throttled()) return;

    const user = $('#aUser').value, pw = $('#aPw').value, keep = $('#aKeep').checked;
    lockErr('Checking…');

    const h = await sha(a.codeSalt + code);
    const idx = a.codes.findIndex(c => !c.used && c.h === h);
