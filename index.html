<style>
:root{
  color-scheme: light;
  --page:#ffffff; --surface:#ffffff; --surface2:#f1f5f2;
  --ink:#0f1a14; --ink2:#46524b; --muted:#6b756f; --line:#e2e9e4; --ring:rgba(0,103,71,.16);
  --accent:#006747; --accent-ink:#ffffff; --accent-soft:#e3efe9; --accent-dark:#004d35;
  --gold:#ffd100; --gold-ink:#003d2a; --gold-soft:#fff5c2;
  --danger:#b42318; --danger-soft:#fbe9e7; --warn-soft:#fff5c2; --warn-ink:#4d3d00;
  --hook:#003922; --draw:#00673d; --straight:#3a9742; --fade:#9eb919; --slice:#ffd100;
  --hook-ink:#ffffff; --draw-ink:#ffffff; --straight-ink:#0f1a14; --fade-ink:#0f1a14; --slice-ink:#0f1a14;
  --radius:14px;
  --tabs-h:64px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  background:var(--page); color:var(--ink);
  font-size:16px; line-height:1.4;
  -webkit-text-size-adjust:100%;
  -webkit-tap-highlight-color: transparent;
}
button{font:inherit;color:inherit;touch-action:manipulation;cursor:pointer}
.wrap{max-width:560px;margin:0 auto;padding:0 14px}
header.top{
  position:sticky;top:0;z-index:20;background:var(--accent);color:#fff;
  padding:calc(env(safe-area-inset-top) + 10px) 0 10px;
  border-bottom:3px solid var(--gold);
}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{font-family:Georgia,"Times New Roman",serif;font-weight:700;font-size:21px;letter-spacing:.005em}
.brand small{display:block;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-weight:500;font-size:12px;color:rgba(255,255,255,.82);letter-spacing:0}
.pill{font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;background:var(--gold);color:var(--gold-ink);white-space:nowrap}
.pill.bad{background:#fff;color:var(--danger)}
main{padding:14px 0 calc(var(--tabs-h) + env(safe-area-inset-bottom) + 24px)}
h2{font-size:20px;margin:4px 0 10px;letter-spacing:-.01em}
h3{font-size:16px;margin:0 0 6px}
.card{background:var(--surface);border:1px solid var(--ring);box-shadow:0 1px 2px rgba(0,61,42,.05);border-radius:var(--radius);padding:14px;margin-bottom:12px}
.muted{color:var(--muted)}
.ink2{color:var(--ink2)}
.small{font-size:13px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  border:1px solid var(--ring);background:var(--surface);border-radius:12px;
  padding:12px 16px;font-weight:600;min-height:46px
}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.danger{color:var(--danger)}
.btn.block{width:100%}
.btn.big{min-height:64px;font-size:20px;border-radius:16px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink2);padding:8px 10px;min-height:40px}
.btn:disabled{opacity:.45}
.btn:active{transform:scale(.985)}
.banner{border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:12px;display:flex;gap:10px;align-items:flex-start}
.banner.warn{background:var(--warn-soft);color:var(--warn-ink)}
.banner.bad{background:var(--danger-soft);color:var(--danger)}
.banner .x{margin-left:auto;background:none;border:0;font-size:18px;line-height:1;padding:0 2px;color:inherit;opacity:.7}

/* club grid */
.clubs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.club{
  position:relative;border:1px solid var(--ring);background:var(--surface);border-radius:12px;
  min-height:52px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-weight:700;font-size:15px
}
.club .n{font-size:11px;font-weight:600;color:var(--muted);margin-top:1px}
.club.sel{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.club.sel .n{color:var(--gold);opacity:1}

/* segmented bar */
.seg{display:flex;gap:2px;height:28px;border-radius:4px;overflow:hidden;background:transparent;margin:8px 0 6px}
.seg.empty{background:var(--surface2);border-radius:4px}

<script>
'use strict';
/* =========================================================
   Golf Tracker — single-file web app (range sessions and rounds)
   Data is stored on this device (localStorage) and can be
   backed up to / restored from a JSON file.
   ========================================================= */
const APP_VERSION = '2.3.0';
const SCHEMA = 4;
const APP_ID = 'golf-range-tracker';
const KEY = 'pcp-golf-range-tracker';           // unique key: other apps share this github.io site
const PREV_KEY = KEY + ':before-restore';

const CLUB_TYPES = [
  {id:'driver', label:'Driver',       group:'woods'},
  {id:'wood',   label:'Fairway wood', group:'woods'},
  {id:'hybrid', label:'Hybrid',       group:'woods'},
  {id:'iron',   label:'Iron',         group:'irons'},
  {id:'wedge',  label:'Wedge',        group:'wedges'},
  {id:'putter', label:'Putter',       group:'putter'},
];
const TYPE = Object.fromEntries(CLUB_TYPES.map(t => [t.id, t]));
const TYPE_ORDER = CLUB_TYPES.map(t => t.id);
const DEFAULT_BAG = [
  {id:'DR', short:'Dr',   name:'Driver',         make:'TaylorMade',     model:'Qi',   type:'driver'},
  {id:'3W', short:'3W',   name:'3 Wood',         make:'TaylorMade',     model:'Qi4D', type:'wood'},
  {id:'3H', short:'3H',   name:'3 Hybrid',       make:'TaylorMade',     model:'Qi4D', type:'hybrid'},
  {id:'4i', short:'4i',   name:'4 Iron',         make:'TaylorMade',     model:'Qi',   type:'iron'},
  {id:'5i', short:'5i',   name:'5 Iron',         make:'TaylorMade',     model:'Qi',   type:'iron'},
  {id:'6i', short:'6i',   name:'6 Iron',         make:'TaylorMade',     model:'Qi',   type:'iron'},
  {id:'7i', short:'7i',   name:'7 Iron',         make:'TaylorMade',     model:'Qi',   type:'iron'},
  {id:'8i', short:'8i',   name:'8 Iron',         make:'TaylorMade',     model:'Qi',   type:'iron'},
  {id:'9i', short:'9i',   name:'9 Iron',         make:'TaylorMade',     model:'Qi',   type:'iron'},
  {id:'PW', short:'PW',   name:'Pitching Wedge', make:'TaylorMade',     model:'Qi',   type:'wedge'},
  {id:'AW', short:'AW',   name:'Approach Wedge', make:'TaylorMade',     model:'Qi',   type:'wedge'},
  {id:'SW', short:'SW',   name:'Sand Wedge',     make:'TaylorMade',     model:'Qi',   type:'wedge'},
  {id:'60', short:'60°',  name:'60° Wedge',      make:'TaylorMade',     model:'MG5',  type:'wedge'},
  {id:'PT', short:'Putt', name:'Putter',         make:'Scotty Cameron', model:'',     type:'putter'},
];
const GROUPS = [
  {id:'woods',  name:'Driver, woods & hybrids'},
  {id:'irons',  name:'Irons'},
  {id:'wedges', name:'Wedges'},
];
let CLUB = {};                                   // id -> club, rebuilt from data.bag
function indexBag(){ CLUB = Object.fromEntries(data.bag.map(c => [c.id, c])); }
const activeClubs = () => data.bag.filter(c => !c.retired);
const isPutt = cid => !!(CLUB[cid] && CLUB[cid].type === 'putter');
const groupOf = cid => CLUB[cid] ? TYPE[CLUB[cid].type].group : null;
const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;
const makeModel = c => [c.make, c.model].filter(Boolean).join(' ');
const fmtHcp = v => v === null || v === undefined ? '–' : (v < 0 ? '+' + Math.abs(v).toFixed(1) : v.toFixed(1));
const SHAPES = ['hook','draw','straight','fade','slice'];
const SHAPE_LABEL = {hook:'Hook', draw:'Draw', straight:'Straight', fade:'Fade', slice:'Slice'};
const STRIKES = ['clean','chunk','thin','topped'];
const STRIKE_LABEL = {clean:'Clean', chunk:'Chunk', thin:'Thin', topped:'Topped'};
const LINES = ['pull','push'];
const LINE_LABEL = {pull:'Pull', push:'Push'};
const RESULTS = ['fairway','green','left','right','bunker','water'];
const RESULT_LABEL = {fairway:'Fairway', green:'Green', left:'Missed left', right:'Missed right', bunker:'Bunker', water:'Water'};
const RESULT_SHORT = {fairway:'Fairway', green:'Green', left:'Left', right:'Right', bunker:'Bunker', water:'Water'};
const GIR_LABEL = {y:'GIR', n:'No GIR'};
const PUTTS = ['holed','left','right','short','long'];
const PUTT_LABEL = {holed:'Holed', left:'Missed left', right:'Missed right', short:'Short', long:'Long'};
const PUTT_SHORT = {holed:'Holed', left:'Left', right:'Right', short:'Short', long:'Long'};

/* ---------- utilities ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const pct = (a, b) => b ? Math.round(a / b * 100) : 0;
const fmtDate = ts => new Date(ts).toLocaleDateString('en-GB', {weekday:'short', day:'numeric', month:'short', year:'numeric'});
const fmtDay = ts => new Date(ts).toLocaleDateString('en-GB', {day:'numeric', month:'short'});
const fmtTime = ts => new Date(ts).toLocaleTimeString('en-GB', {hour:'2-digit', minute:'2-digit'});
function ago(ts){
  if(!ts) return 'never';
  const m = Math.round((Date.now() - ts) / 60000);
  if(m < 1) return 'just now';
  if(m < 60) return m + ' min ago';
  const h = Math.round(m / 60);
  if(h < 24) return h + ' h ago';
  const d = Math.round(h / 24);
  return d === 1 ? '1 day ago' : d + ' days ago';
}

/* ---------- data ---------- */
function emptyData(){
  return {
    app: APP_ID, schema: SCHEMA,
    settings: {hand:'R', keepAwake:true, lastClub:'7i', lastRoundClub:'DR', hideHomeTip:false, lastHoles:18},
    profile: {name:'', surname:'', photo:'', homeCourse:'', handicap:null, handicapHistory:[], bestScore:null, bestScoreCourse:'', bestScoreDate:''},
    bag: DEFAULT_BAG.map(c => Object.assign({retired:false, addedAt:0, retiredAt:null}, c)),
    meta: {createdAt: Date.now(), updatedAt: Date.now(), lastBackupAt: 0, changesSinceBackup: 0},
    sessions: [],
    rounds: [],
    courses: {}
  };
}
function normaliseBag(list){
  const seen = new Set(), out = [];
  (Array.isArray(list) ? list : []).forEach(c => {
    if(!c || !c.id || seen.has(String(c.id))) return;
    seen.add(String(c.id));
    out.push({id:String(c.id), short:String(c.short || c.id).slice(0, 5), name:String(c.name || c.id),
      make:String(c.make || ''), model:String(c.model || ''), type: TYPE[c.type] ? c.type : 'iron',
      retired:!!c.retired, addedAt:+c.addedAt || 0, retiredAt:c.retiredAt ? +c.retiredAt : null});
  });
  return out;
}
function normaliseProfile(p0, base){
  const p = Object.assign({}, base, p0 && typeof p0 === 'object' ? p0 : {});
  ['name','surname','photo','homeCourse','bestScoreCourse','bestScoreDate'].forEach(k => p[k] = typeof p[k] === 'string' ? p[k] : '');
  if(p.photo && !/^data:image\/(jpeg|png|webp);base64,/.test(p.photo)) p.photo = '';
  p.handicap = typeof p.handicap === 'number' && isFinite(p.handicap) ? p.handicap : null;
  p.bestScore = Number.isInteger(p.bestScore) ? p.bestScore : null;
  p.handicapHistory = Array.isArray(p.handicapHistory) ? p.handicapHistory.filter(h => h && typeof h.v === 'number' && h.d) : [];
  return p;
}
function normalise(d){
  const base = emptyData();
  if(!d || typeof d !== 'object') return base;
  // v1 backups have no bag: they get the default bag, whose ids match their shots
  const bag = Array.isArray(d.bag) && d.bag.length ? normaliseBag(d.bag) : base.bag;
  const map = Object.fromEntries(bag.map(c => [c.id, c]));
  const out = {
    app: APP_ID, schema: SCHEMA,
    settings: Object.assign({}, base.settings, d.settings || {}),
    profile: normaliseProfile(d.profile, base.profile),
    bag,
    meta: Object.assign({}, base.meta, d.meta || {}),
    sessions: [],
    rounds: [],
    courses: {}
  };
  const cleanMap = (m, ok) => { const o = {}; if(m && typeof m === 'object') Object.keys(m).forEach(k => { const h = +k, v = m[k]; if(h >= 1 && h <= 18 && ok(v)) o[h] = v; }); return o; };
  if(d.courses && typeof d.courses === 'object') Object.keys(d.courses).forEach(k => {
    const c = d.courses[k]; if(c && typeof c.name === 'string') out.courses[k] = {name:c.name, par:cleanMap(c.par, v => [3, 4, 5, 6].includes(v))};
  });
  const normShots = (list, t0, allowResult) => {
    const shots = [];
    (Array.isArray(list) ? list : []).forEach(x => {
      if(!x || !x.c) return;
      let c = map[x.c];
      if(!c){   // shot for a club missing from the bag: keep it under a retired placeholder
        c = {id:String(x.c), short:String(x.c).slice(0, 5), name:'Club ' + x.c, make:'', model:'',
             type: PUTTS.includes(x.s) ? 'putter' : 'iron', retired:true, addedAt:0, retiredAt:null};
        bag.push(c); map[c.id] = c;
      }
      const dist = allowResult && typeof x.d === 'number' && x.d > 0 && x.d <= 450 ? Math.round(x.d * 10) / 10 : null;
      if(c.type === 'putter'){ if(PUTTS.includes(x.s)){ const pt = {c:c.id, s:x.s, t:x.t || t0}; if(dist) pt.d = dist; if(allowResult && Number.isInteger(x.h) && x.h >= 1 && x.h <= 18) pt.h = x.h; shots.push(pt); } }
      else if(SHAPES.includes(x.s) && STRIKES.includes(x.k || 'clean')){
        const sh = {c:c.id, s:x.s, k:x.k || 'clean', t:x.t || t0};
        if(LINES.includes(x.l)) sh.l = x.l;
        if(allowResult && RESULTS.includes(x.r)) sh.r = x.r;
        if(allowResult && (x.g === 'y' || x.g === 'n')) sh.g = x.g;
        if(dist) sh.d = dist;
        if(allowResult && Number.isInteger(x.h) && x.h >= 1 && x.h <= 18) sh.h = x.h;
        shots.push(sh);
      }
    });
    return shots;
  };
  (Array.isArray(d.sessions) ? d.sessions : []).forEach(s => {
    if(!s || !s.id || !s.startedAt) return;
    const shots = normShots(s.shots, s.startedAt, false);
    out.sessions.push({id:String(s.id), startedAt:+s.startedAt, endedAt:s.endedAt ? +s.endedAt : null, updatedAt:+(s.updatedAt || s.startedAt), shots});
  });
  out.sessions.sort((a, b) => a.startedAt - b.startedAt);
  (Array.isArray(d.rounds) ? d.rounds : []).forEach(r => {
    if(!r || !r.id) return;
    const t0 = +r.startedAt || Date.now();
    const ph = r.photos && typeof r.photos === 'object' ? r.photos : {};
    out.rounds.push({
      id:String(r.id), startedAt:t0, endedAt:r.endedAt ? +r.endedAt : null, updatedAt:+(r.updatedAt || t0),
      date: /^\d{4}-\d{2}-\d{2}$/.test(r.date) ? r.date : isoDay(t0),
      course: typeof r.course === 'string' ? r.course : '', holes: r.holes === 9 ? 9 : 18,
      score: Number.isInteger(r.score) ? r.score : null,
      photos: {cover: typeof ph.cover === 'string' ? ph.cover : null, front: typeof ph.front === 'string' ? ph.front : null, back: typeof ph.back === 'string' ? ph.back : null},
      shots: normShots(r.shots, t0, true),
      mode: r.mode === 'holes' ? 'holes' : null,
      start: r.start === 10 ? 10 : 1,
      cur: Number.isInteger(r.cur) && r.cur >= 1 && r.cur <= 18 ? r.cur : (r.start === 10 ? 10 : 1),
      par: cleanMap(r.par, v => [3, 4, 5, 6].includes(v)),
      pen: cleanMap(r.pen, v => Number.isInteger(v) && v > 0 && v < 10),
      adj: cleanMap(r.adj, v => Number.isInteger(v) && v !== 0 && Math.abs(v) < 21),
      padj: cleanMap(r.padj, v => Number.isInteger(v) && v !== 0 && Math.abs(v) < 11)
    });
    // older versions stored a fixed manual score per hole: turn it into extra strokes on top of the logged shots
    const nr = out.rounds[out.rounds.length - 1];
    Object.entries(cleanMap(r.hs, v => Number.isInteger(v) && v > 0 && v < 21)).forEach(([h, v]) => {
      const d = v - nr.shots.filter(x => x.h === +h).length - (nr.pen[h] || 0);
      if(d) nr.adj[h] = d; else delete nr.adj[h];
    });
  });
  out.rounds.sort((a, b) => a.startedAt - b.startedAt);
  out.rounds.filter(r => !r.endedAt).slice(0, -1).forEach(r => r.endedAt = r.shots.length ? r.shots[r.shots.length - 1].t : r.startedAt);
  // only one open session allowed: close any older open ones
  const open = out.sessions.filter(s => !s.endedAt);
  open.slice(0, -1).forEach(s => s.endedAt = s.shots.length ? s.shots[s.shots.length - 1].t : s.startedAt);
  const lc = map[out.settings.lastClub];
  if(!lc || lc.retired){ const first = bag.find(c => !c.retired); out.settings.lastClub = first ? first.id : ''; }
  const rc = map[out.settings.lastRoundClub];
  if(!rc || rc.retired){ const first = bag.find(c => !c.retired); out.settings.lastRoundClub = first ? first.id : ''; }
  return out;
}

let data;
let loadError = null;
function load(){
  let raw = null;
  try { raw = localStorage.getItem(KEY); } catch(e){ loadError = 'This browser is blocking storage, so nothing can be saved. Turn off Private Browsing.'; }
  if(raw){
    try { data = normalise(JSON.parse(raw)); }
    catch(e){
      try { localStorage.setItem(KEY + ':corrupt-' + Date.now(), raw); } catch(_){}
      loadError = 'Saved data could not be read. A copy was kept — restore your latest backup.';
      data = emptyData();
    }
  } else data = emptyData();
  indexBag();
}

let saveState = {ok:true, at:0};
function save(countsAsChange = true){
  data.meta.updatedAt = Date.now();
  if(countsAsChange) data.meta.changesSinceBackup = (data.meta.changesSinceBackup || 0) + 1;
  indexBag();
  const json = JSON.stringify(data);
  try {
    localStorage.setItem(KEY, json);
    const check = localStorage.getItem(KEY);
    saveState = {ok: check === json, at: Date.now()};
  } catch(e){
    saveState = {ok:false, at:Date.now(), err:e && e.name};
  }
  renderPill();
  if(!saveState.ok) toast('Not saved! Download a backup now.', 3500);
  askPersist();
  return saveState.ok;
}
let persistAsked = false;
function askPersist(){
  if(persistAsked) return; persistAsked = true;
  try { if(navigator.storage && navigator.storage.persist) navigator.storage.persist().then(v => { storagePersisted = v; }).catch(()=>{}); } catch(_){}
}
let storagePersisted = null;
function renderPill(){
  const p = $('#savePill');
  if(!saveState.ok){ p.textContent = '⚠ Not saved'; p.className = 'pill bad'; return; }
  p.className = 'pill';
  p.textContent = saveState.at ? 'Saved ✓ ' + fmtTime(saveState.at) : 'Saved on device';
}

const activeSession = () => data.sessions.find(s => !s.endedAt) || null;
const activeRound = () => data.rounds.find(r => !r.endedAt) || null;
const ctxTarget = ctx => ctx === 'round' ? activeRound() : activeSession();
const ctxClubKey = ctx => ctx === 'round' ? 'lastRoundClub' : 'lastClub';
function ctxClub(ctx){
  let c = CLUB[data.settings[ctxClubKey(ctx)]];
  if(!c || c.retired) c = activeClubs()[0];
  return c || null;
}
function holeList(r){ const st = r.start || 1; return Array.from({length:r.holes}, (_, i) => ((st - 1 + i) % 18) + 1); }
const courseKey = name => (name || '').trim().toLowerCase();
function holeInfo(r, h){
  const shots = r.shots.filter(x => x.h === h);
  const pen = r.pen[h] || 0, par = r.par[h] || null, adj = r.adj[h] || 0;
  // strokes = logged shots + penalties + strokes added with the + button; putts = logged putts + putts added with +
  const total = shots.length + pen + adj;
  const score = total > 0 ? total : null;
  const putts = Math.max(0, shots.filter(x => isPutt(x.c)).length + (r.padj[h] || 0));
  // fairway: tee shot on a par 4/5 marked with a result
  let fir = null;
  if(par >= 4 && shots.length && !isPutt(shots[0].c) && shots[0].r) fir = shots[0].r === 'fairway';
  // green in regulation: strokes taken before the first putt (incl. penalties) <= par - 2
  let gir = null;
  if(par){
    if(putts && score !== null) gir = (score - putts) <= par - 2;
    else { const gi = shots.findIndex(x => x.r === 'green'); if(gi >= 0) gir = (gi + 1 + pen) <= par - 2; }
  }
  return {h, par, shots, putts, pen, adj, score, fir, gir, holed: shots.some(x => isPutt(x.c) && x.s === 'holed')};
}
function roundTotals(r){
  let score = 0, par = 0, thru = 0;
  holeList(r).forEach(h => { const i = holeInfo(r, h); if(i.score !== null){ score += i.score; thru++; if(i.par) par += i.par; } });
  return {score, toPar: score - par, thru};
}
const fmtToPar = n => n === 0 ? 'E' : (n > 0 ? '+' + n : String(n));
function ensurePar(r, h){
  if(!r.par[h]){ r.par[h] = 4; }
}
function rememberPars(r){
  const k = courseKey(r.course); if(!k) return;
  data.courses[k] = {name:r.course.trim(), par:Object.assign({}, (data.courses[k] || {}).par || {}, r.par)};
}
function isoDay(ts){ const d = new Date(ts), p = n => String(n).padStart(2, '0'); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`; }
const fmtISO = iso => fmtDate(new Date(iso + 'T12:00:00').getTime());

/* ---------- scorecard photos: IndexedDB (big quota) + in-memory cache ---------- */
const CARD_SIDES = ['cover', 'front', 'back'];
const CARD_LABEL = {cover:'Cover', front:'Front', back:'Back'};
const MAX_SCAN_MB = 15;
const isPdfUrl = u => typeof u === 'string' && u.startsWith('data:application/pdf');
function dataUrlToBlob(u){
  const i = u.indexOf(','), bin = atob(u.slice(i + 1)), a = new Uint8Array(bin.length);
  for(let k = 0; k < bin.length; k++) a[k] = bin.charCodeAt(k);
  return new Blob([a], {type: u.slice(5, u.indexOf(';'))});
}
const blobUrls = new Map();
function blobUrlFor(u){
  // PDFs are shown from a blob: URL so the page HTML stays small
  let b = blobUrls.get(u);
  if(!b){ b = URL.createObjectURL(dataUrlToBlob(u)); blobUrls.set(u, b); }
  return b;
}
function cardMedia(u, alt){
  if(!isPdfUrl(u)) return `<img src="${u}" alt="${esc(alt)}">`;
  // Safari draws the first page of a PDF in an <img>; other browsers fall back to a PDF label
  return `<img class="pdfimg" src="${blobUrlFor(u)}" alt="${esc(alt)}"><span class="pdfbadge">PDF</span>`;
}
document.addEventListener('error', e => {
  const t = e.target;
  if(t && t.id === 'viewerImg'){ if(t.classList.contains('pdfimg')){ t.hidden = true; $('#viewerNoPrev').hidden = false; } return; }
  if(t && t.classList && t.classList.contains('pdfimg')){ const d = document.createElement('span'); d.className = 'pdfph'; d.innerHTML = '<b>PDF</b><small>scan</small>'; t.replaceWith(d); }
}, true);
const IDB_NAME = KEY + '-photos', IDB_STORE = 'photos';
const photoCache = new Map();
let photosLoaded = false, photoStoreError = false, idbPromise = null;
function idbOpen(){
  if(!idbPromise) idbPromise = new Promise((res, rej) => {
    const r = indexedDB.open(IDB_NAME, 1);
    r.onupgradeneeded = () => r.result.createObjectStore(IDB_STORE);
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
  return idbPromise;
}
function idbReq(mode, fn){
  return idbOpen().then(db => new Promise((res, rej) => {
    const tx = db.transaction(IDB_STORE, mode); let out;
    const rq = fn(tx.objectStore(IDB_STORE)); if(rq) rq.onsuccess = () => { out = rq.result; };
    tx.oncomplete = () => res(out); tx.onerror = tx.onabort = () => rej(tx.error);
  }));
}
async function photoPut(id, url){
  await idbReq('readwrite', st => st.put(url, id));
  const back = await idbReq('readonly', st => st.get(id));       // read back to be sure it stuck
  if(back !== url) throw new Error('verify failed');
  photoCache.set(id, url);
}
async function photoDel(id){ if(!id) return; photoCache.delete(id); try { await idbReq('readwrite', st => st.delete(id)); } catch(_){} }
async function photoLoadAll(){
  const keys = await idbReq('readonly', st => st.getAllKeys());
  const vals = await idbReq('readonly', st => st.getAll());
  (keys || []).forEach((k, i) => photoCache.set(k, vals[i]));
  photosLoaded = true;
}
function photoIdsIn(d){ const ids = new Set(); (d && d.rounds || []).forEach(r => { if(r.photos) CARD_SIDES.forEach(k => { if(r.photos[k]) ids.add(r.photos[k]); }); }); return ids; }
async function prunePhotos(){
  // keep photos used now or by the undo-restore copy
  const used = photoIdsIn(data);
  if(undoState && undoState.kind === 'round'){ try { photoIdsIn({rounds:[JSON.parse(undoState.json)]}).forEach(i => used.add(i)); } catch(_){} }
  try { const prev = JSON.parse(localStorage.getItem(PREV_KEY) || 'null'); photoIdsIn(prev).forEach(i => used.add(i)); } catch(_){}
  for(const k of Array.from(photoCache.keys())) if(!used.has(k)) await photoDel(k);
}

/* ---------- ui state ---------- */
const ui = {tab:'range', source:'all', strike:'clean', line:null, period:'all', cleanOnly:false, openClub:null, statsView:'flight'};

function shapeOrder(){ return data.settings.hand === 'L' ? SHAPES.slice().reverse() : SHAPES; }
function leftShapes(){ return data.settings.hand === 'L' ? ['fade','slice'] : ['hook','draw']; }
function rightShapes(){ return data.settings.hand === 'L' ? ['hook','draw'] : ['fade','slice']; }

/* ---------- tallies ---------- */
function tally(shots, cleanOnly){
  const t = {balls:0, shapeN:0, shape:{}, strike:{}, putt:{}, putts:0, line:{pull:0, push:0}, res:{}, resN:0, gir:{y:0, n:0}, girN:0, dN:0, dSum:0, dMax:0, pdN:0, pdSum:0, pdMax:0};
  RESULTS.forEach(r => t.res[r] = 0);
  SHAPES.forEach(s => t.shape[s] = 0); STRIKES.forEach(s => t.strike[s] = 0); PUTTS.forEach(s => t.putt[s] = 0);
  shots.forEach(x => {
    if(isPutt(x.c)){ t.putts++; t.putt[x.s]++; if(x.d){ t.pdN++; t.pdSum += x.d; t.pdMax = Math.max(t.pdMax, x.d); } return; }

}

const DEFAULT_DIST = {driver:220, wood:200, hybrid:180, wedge:90, putter:3};

  const step = c.type === 'putter' ? 0.5 : 5;
  if(ds.length) return Math.round(ds.reduce((a, b) => a + b, 0) / ds.length / step) * step;

  if(after === 'water') s.pen[h] = (s.pen[h] || 0) + 1;
  else if(before === 'water' && s.pen[h]){ s.pen[h]--; if(!s.pen[h]) delete s.pen[h]; }

function moveHole(dir){
  const r = activeRound(); if(!r) return;
  const list = holeList(r), idx = list.indexOf(r.cur), next = idx + dir;
  if(next < 0) return;
  if(next >= list.length){ rememberPars(r); save(false); openRoundSheet(r.id, 'finish'); return; }
  r.cur = list[next]; ensurePar(r, r.cur);
  // new hole: tee off with the driver on a par 4/5
  const dr = activeClubs().find(c => c.type === 'driver');
  if(dr && r.par[r.cur] >= 4) data.settings.lastRoundClub = dr.id;
  resetToggles(); save(false); render(); window.scrollTo(0, 0);
}
function holedOut(r){
  const i = holeInfo(r, r.cur), list = holeList(r), last = list.indexOf(r.cur) === list.length - 1;
  const msg = `Hole ${r.cur}: ${i.score}${i.par ? ' (' + fmtToPar(i.score - i.par) + ')' : ''}`;
  setTimeout(() => {
    if(activeRound() !== r || !holeInfo(r, r.cur).holed) return;   // undone before we moved on
    if(undoState) undoState.undone = `Back on hole ${r.cur}`;
    toast(last ? msg + ' — last hole' : msg + ` — on to hole ${list[list.indexOf(r.cur) + 1]}`, 5000, true);
    if(last){ rememberPars(r); save(false); openRoundSheet(r.id, 'finish'); }
    else moveHole(1);
  }, 450);
}
function logShot(ctx, shot, note = ''){

function hcpTrend(){
  const pts = data.profile.handicapHistory.slice(-12);
  if(pts.length < 2) return data.profile.handicap !== null ? '<div class="note">Update your handicap when it changes to build a trend line.</div>' : '';
  const W = 300, H = 46, px = 8, py = 8, vals = pts.map(x => x.v), lo = Math.min(...vals), hi = Math.max(...vals), span = hi - lo || 1;
  const X = i => px + i * (W - 2 * px) / (pts.length - 1), Y = v => py + (v - lo) / span * (H - 2 * py);   // lower handicap sits higher
  const path = pts.map((p, i) => `${i ? 'L' : 'M'}${X(i).toFixed(1)} ${Y(p.v).toFixed(1)}`).join(' ');
  const first = pts[0], last = pts[pts.length - 1], delta = Math.round((last.v - first.v) * 10) / 10;
  const word = delta < 0 ? `down ${Math.abs(delta).toFixed(1)}, improving` : delta > 0 ? `up ${delta.toFixed(1)}` : 'no change';
  return `<div class="trend">
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Handicap trend from ${fmtHcp(first.v)} to ${fmtHcp(last.v)}">
      <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"/>
      ${pts.map((p, i) => `<circle cx="${X(i).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="${i === pts.length - 1 ? 4 : 2.5}" fill="${i === pts.length - 1 ? 'var(--accent)' : '#fff'}" stroke="var(--accent)" stroke-width="1.5" vector-effect="non-scaling-stroke"><title>${fmtDay(p.d)}: ${fmtHcp(p.v)}</title></circle>`).join('')}

}

function metricGrid(t, tAll){

    ['chunk','thin','topped'].filter(k => tAll.strike[k]).map(k => `${STRIKE_LABEL[k]} ${pct(tAll.strike[k], tAll.balls)}%`).join(' · ')));
  if(t.shapeN){
    tiles.push(metricTile(pct(t.line.pull, t.shapeN) + '%', 'Pull', pct(t.line.pull, t.shapeN)));
    tiles.push(metricTile(pct(t.line.push, t.shapeN) + '%', 'Push', pct(t.line.push, t.shapeN)));
  }
  const fwMarked = tAll.resN - tAll.res.green;
  if(tAll.res.fairway || (fwMarked && tAll.res.green === 0)) tiles.push(metricTile(pct(tAll.res.fairway, fwMarked) + '%', 'Fairway', pct(tAll.res.fairway, fwMarked), `${fwMarked} marked`));

function insertIndex(type, name){
  // numbered clubs slot in by number (new 7 Iron goes before the 8 Iron, 56° before 60°)
  const num = x => { const m = String(x).match(/(\d+)/); return m ? +m[1] : null; };
  const ti = TYPE_ORDER.indexOf(type), nn = num(name);
  if(nn !== null){
    const i = data.bag.findIndex(c => c.type === type && num(c.name) !== null && num(c.name) > nn);
    if(i >= 0) return i;
  }
  for(let i = data.bag.length - 1; i >= 0; i--) if(TYPE_ORDER.indexOf(data.bag[i].type) <= ti) return i + 1;
  return 0;
}

async function processPhoto(file){
  // centre-crop to a square and shrink to 256 px so it stays small in storage and backups
  let url;
  try {
    url = URL.createObjectURL(file);
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const S = 256, side = Math.min(img.naturalWidth, img.naturalHeight);
    const c = document.createElement('canvas'); c.width = c.height = S;
    c.getContext('2d').drawImage(img, (img.naturalWidth - side) / 2, (img.naturalHeight - side) / 2, side, side, 0, 0, S, S);
    ui.pendingPhoto = c.toDataURL('image/jpeg', 0.85);
    const av = $('#pAvatar'); if(av) av.innerHTML = avatarInner(ui.pendingPhoto);
    const pb = $('#pPhotoBtns'); if(pb) pb.innerHTML = photoButtons(true);
  } catch(e){
    alertBox('That photo could not be read. Try a different one.');
  } finally { if(url) URL.revokeObjectURL(url); }
}
function parseHcp(txt){
  const t = txt.trim().replace(',', '.');
  if(!t) return {ok:true, v:null};
  const m = t.match(/^([+-]?)(\d{1,2}(\.\d)?)$/);
  if(!m) return {ok:false};
  let v = parseFloat(m[2]);
  if(m[1] === '+') v = -v;                // plus handicaps stored as negative
  if(v < -10 || v > 54) return {ok:false};
  return {ok:true, v};
}
function clubTable(cid, ev){

    }).join('') + '</tbody></table>' + key;

function roundsSummary(done){
  const scored = done.filter(r => r.score !== null && r.holes === 18);
  const avg = scored.length ? (scored.reduce((a, r) => a + r.score, 0) / scored.length) : null;
  const best = scored.length ? Math.min(...scored.map(r => r.score)) : null;
  const shots = done.flatMap(r => r.shots);
  const t = tally(shots);

function courseKPIs(rounds){
  const k = {firY:0, firN:0, girY:0, girN:0, putts:0, puttHoles:0};
  rounds.forEach(r => {
    if(r.mode === 'holes'){
      holeList(r).forEach(h => { const i = holeInfo(r, h);
        if(i.fir !== null){ k.firN++; if(i.fir) k.firY++; }
        if(i.gir !== null){ k.girN++; if(i.gir) k.girY++; }
        if(i.score !== null && i.putts){ k.putts += i.putts; k.puttHoles++; } });
    } else {
      const t = tally(r.shots);
      k.firY += t.res.fairway; k.firN += t.resN - t.res.green;
      k.girY += t.gir.y; k.girN += t.girN;
    }
  });
  return k;
}

const isPdfFile = f => f.type === 'application/pdf' || /\.pdf$/i.test(f.name || '');
async function processCardPhoto(file, side){
  if(isPdfFile(file)){
    // scans are kept exactly as scanned (all pages)
    if(file.size > MAX_SCAN_MB * 1048576) return alertBox(`That scan is ${(file.size / 1048576).toFixed(1)} MB. The limit is ${MAX_SCAN_MB} MB, so try scanning one side of the card at a time.`);
    try {
      const u = await new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = () => rej(fr.error); fr.readAsDataURL(file); });
      if(typeof u !== 'string' || !u.startsWith('data:application/pdf')) throw new Error('not a pdf');
      ui.cardPending[side] = u; refreshCardTiles();
    } catch(e){ alertBox('That scan could not be read. Try saving it again as a PDF, or take a photo instead.'); }
    return;
  }
  // photos and image scans: keep readable, longest side 1600 px, JPEG
  let url;
  try {
    url = URL.createObjectURL(file);
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const max = 1600, k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const w = Math.round(img.naturalWidth * k), h = Math.round(img.naturalHeight * k);
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    c.getContext('2d').drawImage(img, 0, 0, w, h);
    ui.cardPending[side] = c.toDataURL('image/jpeg', 0.78);
    refreshCardTiles();
  } catch(e){ alertBox('That file could not be read. Use a photo (JPEG or PNG) or a PDF scan.'); }
  finally { if(url) URL.revokeObjectURL(url); }
}

async function saveRoundSheetInner(){

  expireUndo();
  const f = readRoundForm();
  const sTxt = $('#rScore').value.trim();
  const score = sTxt ? parseInt(sTxt, 10) : null;
  if(sTxt && (!Number.isInteger(score) || String(score) !== sTxt || score < 9 || score > 200)) return alertBox('Score should be a whole number, e.g. 86.');
  let r;
  if(rs.id) r = data.rounds.find(x => x.id === rs.id);
  else { const now = Date.now(); r = {id:uid(), startedAt:now, endedAt:now, updatedAt:now, photos:{cover:null, front:null, back:null}, shots:[]}; data.rounds.push(r); }
  if(!r) return;
  Object.assign(r, f, {score, updatedAt: Date.now()});
  if(rs.mode === 'finish') r.endedAt = Date.now();
  if(r.mode === 'holes') rememberPars(r);
  let photoFail = false;
  for(const side of CARD_SIDES){

      const pid = 'sc_' + uid();
      try { await photoPut(pid, p); r.photos[side] = pid; } catch(e){ photoFail = true; continue; }
    }
    if(old) await photoDel(old);

  else if(ok) toast(rs.mode === 'edit' ? 'Round updated' : 'Round saved');
  if(rs.mode === 'finish' && ok && !photoFail){
    const b = await choose('Round saved ✓', 'Back up now so it\'s safe off this phone too?', [{id:'yes', label:'Back up now', cls:'primary'}, {id:'no', label:'Later', cls:'ghost'}]);
    if(b === 'yes') doBackup(false);
  }
}
function scorecardTable(r, edit){
  // a scorecard built from the pars you set: Out (1-9), In (10-18) and Total, in the order the holes were played
  const rows = holeList(r).map(h => holeInfo(r, h));
  const mk = v => v === null ? '' : (v ? '✓' : '·');
  const sum = (a, f) => a.reduce((n, x) => n + (f(x) || 0), 0);
  const tone = x => x.score !== null && x.par ? (x.score < x.par ? 'under' : x.score > x.par ? 'over' : '') : '';
  const parCell = x => edit
    ? `<div class="pmini">${[3, 4, 5].map(v => `<button class="${x.par === v ? 'on' : ''}" data-action="cardPar" data-h="${x.h}" data-v="${v}" aria-label="Hole ${x.h} par ${v}" aria-pressed="${x.par === v}">${v}</button>`).join('')}</div>`
    : (x.par ?? '');
  const row = x => `<tr class="${edit && x.h === r.cur ? 'curh' : ''}"><td>${edit ? `<button class="hjump" data-action="cardHole" data-h="${x.h}" aria-label="Go to hole ${x.h}">${x.h}</button>` : x.h}</td><td>${parCell(x)}</td><td class="${tone(x)}">${x.score ?? ''}</td><td>${x.score !== null ? x.putts : ''}</td><td>${mk(x.fir)}</td><td>${mk(x.gir)}</td></tr>`;
  const sub = (lbl, a) => {
    const pl = a.filter(x => x.score !== null), tp = sum(pl.filter(x => x.par), x => x.score - x.par);
    const fr = a.filter(x => x.fir !== null), gr = a.filter(x => x.gir !== null);
    return `<tr class="tot"><td>${lbl}</td><td>${a.every(x => x.par) ? sum(a, x => x.par) : ''}</td><td>${pl.length ? `${sum(pl, x => x.score)}<span class="tp">${fmtToPar(tp)}</span>` : ''}</td><td>${pl.length ? sum(pl, x => x.putts) : ''}</td><td>${fr.length ? `${fr.filter(x => x.fir).length}/${fr.length}` : ''}</td><td>${gr.length ? `${gr.filter(x => x.gir).length}/${gr.length}` : ''}</td></tr>`;
  };
  let body = '';
  rows.forEach(x => {
    body += row(x);
    if(r.holes === 18 && x.h === 9) body += sub('Out', rows.filter(y => y.h <= 9));
    if(r.holes === 18 && x.h === 18) body += sub('In', rows.filter(y => y.h >= 10));
  });
  body += sub('Total', rows);
  return `<table class="tbl sc-tbl ${edit ? 'edit' : ''}"><thead><tr><th>Hole</th><th>Par</th><th>Score</th><th>Putts</th><th>FIR</th><th>GIR</th></tr></thead><tbody>${body}</tbody></table>`;
}

function backupName(){

}
function backupJSON(){
  const photos = {};
  photoIdsIn(data).forEach(id => { const u = photoCache.get(id); if(u) photos[id] = u; });
  return JSON.stringify({app:APP_ID, schema:SCHEMA, appVersion:APP_VERSION, exportedAt:new Date().toISOString(), data, photos});
}
function markBackedUp(){
  data.meta.lastBackupAt = Date.now();

  save(false);

function downloadFile(json, name){
  const blob = new Blob([json], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name; a.rel = 'noopener';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}
async function doBackup(forceDownload){
  if(!photosLoaded && photoIdsIn(data).size && !photoStoreError) return alertBox('Scorecard photos are still loading. Try again in a moment.');
  const json = backupJSON(), name = backupName();
  let file = null;
  try { file = new File([json], name, {type:'application/json'}); } catch(_){}
  if(!forceDownload && file && navigator.canShare && navigator.canShare({files:[file]})){
    try {
      await navigator.share({files:[file], title:'Golf Tracker backup'});
      markBackedUp(); toast('Backup saved');
      return;
    } catch(e){
      if(e && e.name === 'AbortError'){ toast('Backup cancelled — nothing saved'); return; }
      // share failed for another reason: fall back to download
    }
  }
  downloadFile(json, name);
  markBackedUp();
  toast('Backup downloaded — check your Downloads');
}

function readBackupObject(obj){
  if(!obj || typeof obj !== 'object') return null;
  if(obj.app === APP_ID && obj.data) return obj.data;
  if(obj.app === APP_ID && Array.isArray(obj.sessions)) return obj; // raw data object
  return null;
}
async function handleRestoreFile(file){
  expireUndo();
  let text;
  try { text = await file.text(); } catch(e){ return alertBox('Could not read that file.'); }
  let obj; try { obj = JSON.parse(text); } catch(e){ return alertBox('That is not a Golf Tracker backup file (could not read it).'); }
  const raw = readBackupObject(obj);
  if(!raw) return alertBox('That file is not a Golf Tracker backup.');
  const incoming = normalise(raw);
  const balls = incoming.sessions.concat(incoming.rounds).reduce((a, s) => a + s.shots.length, 0);
  const when = obj.exportedAt ? fmtDate(Date.parse(obj.exportedAt)) + ' ' + fmtTime(Date.parse(obj.exportedAt)) : 'unknown date';
  const curBalls = data.sessions.concat(data.rounds).reduce((a, s) => a + s.shots.length, 0);
  const inPhotos = obj.photos && typeof obj.photos === 'object' ? obj.photos : {};
  const choice = await choose(`Restore this backup?`,
    `Backup from <b>${esc(when)}</b>${obj.appVersion ? ' (app v' + esc(obj.appVersion) + ')' : ''}: <b>${incoming.sessions.length}</b> sessions, <b>${balls}</b> shots, <b>${incoming.rounds.length}</b> rounds.<br><br>This device has ${data.sessions.length} sessions, ${curBalls} shots, ${data.rounds.length} rounds.`,
    [{id:'replace', label:'Replace everything with the backup', cls:'primary'},
     {id:'merge', label:'Merge (keep both, no duplicates)'},
     {id:'cancel', label:'Cancel', cls:'ghost'}]);
  if(choice === 'cancel' || !choice) return;
  try { localStorage.setItem(PREV_KEY, JSON.stringify(data)); } catch(_){}
  let photoFail = 0;
  for(const [pid, url] of Object.entries(inPhotos)){
    if(typeof url !== 'string' || !/^data:(image\/|application\/pdf)/.test(url) || photoCache.get(pid) === url) continue;
    try { await photoPut(pid, url); } catch(e){ photoFail++; }
  }
  if(choice === 'replace'){
    const keep = {settings: data.settings};
    data = incoming;
    data.settings = Object.assign({}, incoming.settings, {hideHomeTip: keep.settings.hideHomeTip});
  } else {
    const byId = new Map(data.sessions.map(s => [s.id, s]));
    incoming.sessions.forEach(s => {
      const mine = byId.get(s.id);
      if(!mine) byId.set(s.id, s);
      else if(s.shots.length > mine.shots.length || (s.shots.length === mine.shots.length && s.updatedAt > mine.updatedAt)) byId.set(s.id, s);
    });
    const bagIds = new Set(data.bag.map(c => c.id));
    incoming.bag.forEach(c => { if(!bagIds.has(c.id)) data.bag.push(c); });
    const p = data.profile, ip = incoming.profile;
    ['name','surname','photo','homeCourse','bestScoreCourse','bestScoreDate'].forEach(k => { if(!p[k] && ip[k]) p[k] = ip[k]; });
    if(p.handicap === null && ip.handicap !== null) p.handicap = ip.handicap;
    if(p.bestScore === null && ip.bestScore !== null) p.bestScore = ip.bestScore;
    const hd = new Set(p.handicapHistory.map(x => x.d));
    ip.handicapHistory.forEach(x => { if(!hd.has(x.d)) p.handicapHistory.push(x); });
    p.handicapHistory.sort((a, b) => a.d - b.d);
    const rById = new Map(data.rounds.map(r => [r.id, r]));
    incoming.rounds.forEach(r => {
      const mine = rById.get(r.id);
      if(!mine || r.shots.length > mine.shots.length || (r.shots.length === mine.shots.length && r.updatedAt > mine.updatedAt)) rById.set(r.id, r);
    });
    Object.keys(incoming.courses || {}).forEach(k => { if(!data.courses[k]) data.courses[k] = incoming.courses[k]; });
    data = normalise(Object.assign({}, data, {sessions: Array.from(byId.values()), rounds: Array.from(rById.values())}));
  }
  data.meta.lastBackupAt = Math.max(data.meta.lastBackupAt || 0, obj.exportedAt ? Date.parse(obj.exportedAt) : 0);
  data.meta.changesSinceBackup = choice === 'merge' ? 1 : 0;
  loadError = null;
  const ok = save(false);
  render();
  toast(ok ? (choice === 'replace' ? 'Backup restored' : 'Backup merged') : 'Restore did not save!');
  if(photoFail) alertBox(`${plural(photoFail, 'scorecard photo')} could not be stored on this phone. Everything else was restored.`);
}

let toastTimer;
function toast(msg, ms = 1700, withUndo = false){

  t.innerHTML = `<span>${esc(msg)}</span>${act ? '<button class="tundo" data-action="undoLast">Undo</button>' : ''}`;
  t.classList.toggle('act', act); t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.classList.remove('show', 'act'); expireUndo(); }, act ? Math.max(ms, 5000) : ms);
}
/* ---------- one-step undo: a copy of the session or round from just before the last change ---------- */
let undoState = null;
const listOf = kind => kind === 'round' ? data.rounds : data.sessions;
function remember(kind, obj, opts = {}){
  if(!obj) return;
  expireUndo();
  undoState = Object.assign({kind, id: obj.id, json: JSON.stringify(obj), index: listOf(kind).indexOf(obj)}, opts);
}
function expireUndo(){
  const u = undoState; undoState = null;
  if(u && u.prune) prunePhotos();     // a deleted round's photos are only removed once Undo is gone
}
function undoLast(){
  const u = undoState; if(!u) return;
  undoState = null;
  const list = listOf(u.kind), obj = JSON.parse(u.json), i = list.findIndex(x => x.id === u.id);
  if(i >= 0) list[i] = obj; else list.splice(Math.max(0, Math.min(u.index, list.length)), 0, obj);
  ui.roundSheet = null; ui.edit = null; closeSheet();
  resetToggles(); save(); render();
  toast(u.undone || 'Undone');
}

/* ---------- forgotten session / round check ---------- */
const STALE_MS = 8 * 3600e3;
function lastActivity(x){ const last = x.shots.length ? x.shots[x.shots.length - 1].t : 0; return Math.max(x.startedAt || 0, last || 0, x.updatedAt || 0); }
let staleChecking = false;
async function checkStale(){
  if(staleChecking || lockView || modalResolve) return;
  staleChecking = true;
  try {
    const s = activeSession();
    if(s && Date.now() - lastActivity(s) > STALE_MS){
      const c = await choose('Range session still open', `Your range session from <b>${fmtDate(s.startedAt)}</b> was never ended. Last activity ${ago(lastActivity(s))}.`,
        [{id:'end', label:'End it now', cls:'primary'}, {id:'keep', label:'Keep going with it', cls:'ghost'}]);
      if(c === 'end'){
        if(!s.shots.length) data.sessions = data.sessions.filter(x => x !== s);
        else { s.endedAt = lastActivity(s); s.updatedAt = Date.now(); }
        save(); render(); toast('Old session ended');
      } else { s.updatedAt = Date.now(); save(false); }
    }
    const r = activeRound();
    if(r && Date.now() - lastActivity(r) > STALE_MS){
      const c = await choose('Round still open', `Your round${r.course ? ' at <b>' + esc(r.course) + '</b>' : ''} on ${fmtISO(r.date)} was never finished. Last activity ${ago(lastActivity(r))}.`,
        [{id:'finish', label:'Finish it now', cls:'primary'}, {id:'keep', label:'Keep going with it', cls:'ghost'}]);
      if(c === 'finish'){ ui.tab = 'rounds'; render(); openRoundSheet(r.id, 'finish'); }
      else { r.updatedAt = Date.now(); save(false); }
    }
  } finally { staleChecking = false; }
}
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible' && !lockView) setTimeout(checkStale, 400); });

/* ---------- screen wake lock ---------- */
let wakeLock = null;
async function updateWakeLock(){
  // range sessions only: on the course the phone should sleep in your pocket (saves battery, no stray taps)
  const want = !!(activeSession() && ui.tab === 'range' && !lockView && data.settings.keepAwake && document.visibilityState === 'visible');
  try {
    if(want && !wakeLock && navigator.wakeLock){
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    } else if(!want && wakeLock){ await wakeLock.release(); wakeLock = null; }
  } catch(_){ wakeLock = null; }
}
document.addEventListener('visibilitychange', updateWakeLock);

  distStep: el => {
    const inp = $('#distIn'); const c = ctxClub('round'); if(!inp || !c) return;
    const step = c.type === 'putter' ? 0.5 : 5;
    let v = parseFloat((inp.value || '').replace(',', '.'));
    v = isNaN(v) ? distBaseline(c) : v + (+el.dataset.d) * step;

  hscore: el => {
    const r = activeRound(); if(!r) return; const h = r.cur, i = holeInfo(r, h), d = +el.dataset.d;
    const base = i.shots.length + i.pen, cur = i.score || 0;
    const next = Math.min(20, Math.max(cur + d, i.shots.length ? 1 : 0, i.putts));
    if(next === cur) return;
    if(next - base) r.adj[h] = next - base; else delete r.adj[h];
    r.updatedAt = Date.now(); save(); render();
  },
  hputts: el => {
    const r = activeRound(); if(!r) return; const h = r.cur, i = holeInfo(r, h), d = +el.dataset.d;
    const logged = i.shots.filter(x => isPutt(x.c)).length, next = Math.min(10, Math.max(0, i.putts + d));
    if(next === i.putts) return;
    if(next - logged) r.padj[h] = next - logged; else delete r.padj[h];
    // putts are part of the score: a putt added beyond the strokes counted adds a stroke too
    if(next > (i.score || 0)){ const a = (r.adj[h] || 0) + next - (i.score || 0); if(a) r.adj[h] = a; else delete r.adj[h]; }
    r.updatedAt = Date.now(); save(); render();
  },
  pen: el => { const r = activeRound(); if(!r) return; const v = Math.max(0, (r.pen[r.cur] || 0) + (+el.dataset.d)); if(v) r.pen[r.cur] = v; else delete r.pen[r.cur]; save(); render(); },

    let x;
    if(s.mode === 'holes'){
      const k = s.shots.map(y => y.h).lastIndexOf(s.cur); if(k < 0) return;
      x = s.shots.splice(k, 1)[0];
      if(x.r === 'water' && s.pen[s.cur]){ s.pen[s.cur]--; if(!s.pen[s.cur]) delete s.pen[s.cur]; }
    } else x = s.shots.pop();
    s.updatedAt = Date.now(); save(); render();
    toast(`Removed ${CLUB[x.c].short}: ${shotLabel(x)}`, 5000, true);
  },

  hand: el => { data.settings.hand = el.dataset.h; save(false); render(); },
  awake: el => { data.settings.keepAwake = el.dataset.v === '1'; save(false); render(); },
  hideTip: () => { data.settings.hideHomeTip = true; save(false); render(); },
  clearAll: async () => {
    expireUndo();
    const ok = await confirmBox('Delete all data?', 'Every session and round on this device will be removed. Download a backup first if you might want it back.', 'Delete everything', true);
    if(!ok) return;
    try { localStorage.setItem(PREV_KEY, JSON.stringify(data)); } catch(_){}
    const settings = data.settings;
    data = emptyData(); data.settings = settings; data.meta.lastBackupAt = 0;
    save(false); render(); toast('All data deleted');
    prunePhotos();
  },
  modalChoice: el => { $('#modal').classList.remove('show'); const r = modalResolve; modalResolve = null; if(r) r(el.dataset.id); }
};
// Ignore a second tap that lands too soon after the first (stops double-logged shots and duplicate rounds)
const TAP_GUARD = {shape:['log', 450], putt:['log', 450], start:['start', 900], beginRound:['beginRound', 900], saveRound:['saveRound', 400],
  cardOnly:['cardOnly', 500], finishRound:['finishRound', 500], end:['end', 600], saveProfile:['save', 600], saveClub:['save', 600]};
const lastTap = {};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const fn = actions[el.dataset.action];
  if(!fn) return;
  e.preventDefault();
  if(el.closest('#sheet') && !$('#sheet').classList.contains('show')) return;   // sheet is closing
  const g = TAP_GUARD[el.dataset.action];
  if(g){ const now = Date.now(); if(now - (lastTap[g[0]] || 0) < g[1]) return; lastTap[g[0]] = now; }
  fn(el);
});
$('#photoInput').addEventListener('change', e => {
  const f = e.target.files && e.target.files[0];
  e.target.value = '';
  if(f) processPhoto(f);
});
$('#cardInput').addEventListener('change', e => {

});
$('#restoreInput').addEventListener('change', e => {

  if(f) handleRestoreFile(f);
});

/* ---------- login: username, password, recovery codes ----------
   The password and codes are stored only as salted hashes, on this device.
   The login is kept separate from the app data and from backups. */
const AUTH_KEY = KEY + ':auth', SESS_KEY = KEY + ':session', AUTH_ITER = 210000;
let lockView = null, pendingCodes = null, recoverIdx = null, failCount = 0, lockUntil = 0;
const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64 = str => Uint8Array.from(atob(str), c => c.charCodeAt(0));
function randBytes(n){ const a = new Uint8Array(n); crypto.getRandomValues(a); return a; }
async function pbkdf2(pw, salt, iter){
  const key = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
  return b64(await crypto.subtle.deriveBits({name:'PBKDF2', hash:'SHA-256', salt, iterations:iter}, key, 256));
}
async function sha(str){ return b64(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str))); }
function newCodes(){
  const A = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';           // no 0/O or 1/I to mix up
  return Array.from({length:8}, () => { const r = randBytes(8); let c = ''; for(let i = 0; i < 8; i++) c += A[r[i] % 32]; return c.slice(0, 4) + '-' + c.slice(4); });
}
const normCode = c => (c || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
const sameUser = (a, b) => (a || '').trim().toLowerCase() === (b || '').trim().toLowerCase();
function getAuth(){ try { const a = JSON.parse(localStorage.getItem(AUTH_KEY) || 'null'); return a && a.user && a.hash ? a : null; } catch(_){ return null; } }
function putAuth(a){ a.updatedAt = Date.now(); const j = JSON.stringify(a); localStorage.setItem(AUTH_KEY, j); return localStorage.getItem(AUTH_KEY) === j; }
async function hashCodes(codes){ const salt = b64(randBytes(16)); return {codeSalt: salt, codes: await Promise.all(codes.map(async c => ({h: await sha(salt + normCode(c)), used:false})))}; }
async function checkPassword(a, pw){ return (await pbkdf2(pw, unb64(a.salt), a.iter || AUTH_ITER)) === a.hash; }
async function setPassword(a, pw){ const salt = randBytes(16); a.salt = b64(salt); a.iter = AUTH_ITER; a.hash = await pbkdf2(pw, salt, AUTH_ITER); }
const codesLeft = a => a ? a.codes.filter(c => !c.used).length : 0;
function isUnlocked(){
  const a = getAuth(); if(!a) return false;
  try { if(sessionStorage.getItem(SESS_KEY) === a.user) return true; } catch(_){}
  try {
    const ses = JSON.parse(localStorage.getItem(SESS_KEY) || 'null');
    if(ses && ses.u === a.user && ses.exp > Date.now()){ ses.exp = Date.now() + 30 * 864e5; localStorage.setItem(SESS_KEY, JSON.stringify(ses)); return true; }
  } catch(_){}
  return false;
}
function setSession(user, keep){
  try { sessionStorage.setItem(SESS_KEY, user); } catch(_){}
  if(keep) localStorage.setItem(SESS_KEY, JSON.stringify({u:user, exp:Date.now() + 30 * 864e5}));
  else localStorage.removeItem(SESS_KEY);
}
function clearSession(){ try { sessionStorage.removeItem(SESS_KEY); } catch(_){} localStorage.removeItem(SESS_KEY); }
function pwProblem(pw, pw2){
  if(pw.length < 6) return 'Password needs at least 6 characters.';
  if(pw !== pw2) return 'The two passwords don\'t match.';
  return '';
}
function codesFileText(user, codes){
  return `Golf Tracker recovery codes\nUsername: ${user}\nCreated: ${fmtDate(Date.now())} ${fmtTime(Date.now())}\n\n${codes.join('\n')}\n\nEach code works once. Use one if you forget your password.\n`;
}
async function saveCodesFile(user, codes){
  const txt = codesFileText(user, codes), name = 'golf-tracker-recovery-codes.txt';
  let file = null; try { file = new File([txt], name, {type:'text/plain'}); } catch(_){}
  if(file && navigator.canShare && navigator.canShare({files:[file]})){
    try { await navigator.share({files:[file], title:'Golf Tracker recovery codes'}); toast('Codes saved'); return; }
    catch(e){ if(e && e.name === 'AbortError') return; }
  }
  const url = URL.createObjectURL(new Blob([txt], {type:'text/plain'}));
  const el = document.createElement('a'); el.href = url; el.download = name; document.body.appendChild(el); el.click(); el.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  toast('Codes downloaded');
}
async function copyCodes(codes){
  try { await navigator.clipboard.writeText(codes.join('\n')); toast('Codes copied'); } catch(_){ toast('Copy not available here, use Save instead'); }
}
function codesBlock(codes){
  return `<div class="codes">${codes.map(c => `<code>${c}</code>`).join('')}</div>
    <div class="row" style="gap:8px"><button type="button" class="btn" style="flex:1" data-action="copyCodes">Copy</button><button type="button" class="btn" style="flex:1" data-action="saveCodes">Save to Files / Dropbox</button></div>`;
}
function lockLogo(){ const l = document.querySelector('link[rel="apple-touch-icon"]'); return l ? `<img class="logo" src="${l.href}" alt="">` : ''; }
function showLock(view){
  document.body.classList.add('locked');
  closeSheet();
  lockView = view;
  $('#lock').hidden = false;
  renderLock();
}
function unlockApp(){
  document.body.classList.remove('locked');
  $('#lock').hidden = true; $('#lock').innerHTML = '';
  lockView = null; pendingCodes = null; recoverIdx = null;
  render();
  setTimeout(checkStale, 600);
}
function renderLock(err){
  const a = getAuth();
  const e = `<div class="err" id="lockErr">${err ? esc(err) : ''}</div>`;
  let h = `<div class="inner">${lockLogo()}<h1>Golf Tracker</h1>`;
  if(!(window.crypto && crypto.subtle)){
    h += `<p class="sub">The login needs a secure (https) connection. Open the app from its GitHub link.</p></div>`;
    $('#lock').innerHTML = h; return;
  }
  if(lockView === 'setup'){
    h += `<p class="sub">Create your login</p>
      <form data-form="setup" autocomplete="on">
        <label class="field"><span>Username</span><input id="aUser" type="text" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required></label>
        <label class="field"><span>Password</span><input id="aPw" type="password" autocomplete="new-password" required></label>
        <label class="field"><span>Repeat password</span><input id="aPw2" type="password" autocomplete="new-password" required></label>
        ${e}<button class="btn primary block" type="submit">Create login</button>
      </form>
      <p class="note" style="text-align:center">Your sessions, rounds and photos stay on this phone. After this you'll get 8 recovery codes in case you forget your password.</p>`;
  } else if(lockView === 'codes'){
    h += `<p class="sub">Your recovery codes</p>
      <p class="small ink2" style="margin:0">If you forget your password, any one of these codes lets you set a new one. Each code works once. Keep them somewhere safe <b>off this phone</b>, e.g. Dropbox or Notes. You won't see them again.</p>
      ${codesBlock(pendingCodes || [])}
      <label class="check"><input type="checkbox" id="codesSaved"> I've saved these codes somewhere safe</label>
      ${e}<button class="btn primary block" type="button" data-action="codesDone">Continue to the app</button>`;
  } else if(lockView === 'login'){
    h += `<p class="sub">Sign in</p>
      <form data-form="login" autocomplete="on">
        <label class="field"><span>Username</span><input id="aUser" type="text" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" value="${a ? esc(a.user) : ''}" required></label>
        <label class="field"><span>Password</span><input id="aPw" type="password" autocomplete="current-password" required></label>
        <label class="check"><input type="checkbox" id="aKeep" checked> Keep me signed in on this phone</label>
        ${e}<button class="btn primary block" type="submit">Sign in</button>
      </form>
      <button class="linkbtn" type="button" data-action="lockGo" data-v="recover">Forgot password? Use a recovery code</button>`;
  } else if(lockView === 'recover'){
    h += `<p class="sub">Use a recovery code</p>
      <form data-form="recover">
        <label class="field"><span>Recovery code</span><input id="aCode" type="text" autocomplete="one-time-code" autocapitalize="characters" autocorrect="off" spellcheck="false" placeholder="ABCD-EFGH" required></label>
        ${e}<button class="btn primary block" type="submit">Check code</button>
      </form>
      <p class="note" style="text-align:center">${codesLeft(a)} of 8 codes unused.</p>
      <button class="linkbtn" type="button" data-action="lockGo" data-v="login">Back to sign in</button>
      <button class="linkbtn" type="button" style="color:var(--danger)" data-action="lockGo" data-v="reset">Lost your recovery codes too?</button>`;
  } else if(lockView === 'newpw'){
    h += `<p class="sub">Code accepted. Set a new password.</p>
      <form data-form="newpw" autocomplete="on">
        <label class="field"><span>Username</span><input id="aUser" type="text" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" value="${a ? esc(a.user) : ''}" required></label>
        <label class="field"><span>New password</span><input id="aPw" type="password" autocomplete="new-password" required></label>
        <label class="field"><span>Repeat new password</span><input id="aPw2" type="password" autocomplete="new-password" required></label>
        ${e}<button class="btn primary block" type="submit">Save and sign in</button>
      </form>`;
  } else if(lockView === 'reset'){
    h += `<p class="sub">Start again without a code</p>
      <p class="small ink2">Without your password or a recovery code, the only way in is to <b>erase everything in the app on this phone</b>: login, sessions, rounds and scorecard photos. Then create a new login and restore your latest backup from Dropbox. Backups are not locked.</p>
      <form data-form="reset">
        <label class="field"><span>Type ERASE to confirm</span><input id="aErase" type="text" autocapitalize="characters" autocorrect="off" spellcheck="false" required></label>
        ${e}<button class="btn danger block" type="submit">Erase and start again</button>
      </form>
      <button class="linkbtn" type="button" data-action="lockGo" data-v="recover">Back</button>`;
  }
  $('#lock').innerHTML = h + '</div>';
  const first = $('#lock input:not([type=checkbox])'); if(first && !first.value) setTimeout(() => { try { first.focus(); } catch(_){} }, 50);
}
function lockErr(msg){ const el = $('#lockErr'); if(el) el.textContent = msg; }
function throttled(){ if(Date.now() < lockUntil){ lockErr(`Too many tries. Wait ${Math.ceil((lockUntil - Date.now()) / 1000)} seconds.`); return true; } return false; }
function failed(msg){ failCount++; if(failCount >= 5){ failCount = 0; lockUntil = Date.now() + 30000; } lockErr(msg); }
const authForms = {
  setup: async () => {
    const user = $('#aUser').value.trim(), pw = $('#aPw').value, pw2 = $('#aPw2').value;
    if(user.length < 3) return lockErr('Username needs at least 3 characters.');
    const prob = pwProblem(pw, pw2); if(prob) return lockErr(prob);
    lockErr('Setting up…');
    const a = {v:1, user, createdAt:Date.now()};
    await setPassword(a, pw);
    const codes = newCodes(); Object.assign(a, await hashCodes(codes));
    if(!putAuth(a)) return lockErr('Could not save the login on this phone. Check you are not in Private Browsing.');
    setSession(user, true);
    pendingCodes = codes; lockView = 'codes'; renderLock();
  },
  login: async () => {
    if(throttled()) return;
    const a = getAuth(); if(!a) return showLock('setup');
    const user = $('#aUser').value, pw = $('#aPw').value, keep = $('#aKeep').checked;
    lockErr('Checking…');
    if(!sameUser(user, a.user) || !(await checkPassword(a, pw))) return failed('Username or password is wrong.');
    failCount = 0; setSession(a.user, keep); unlockApp();
  },
  recover: async () => {
    if(throttled()) return;
    const a = getAuth(); if(!a) return showLock('setup');
    const code = normCode($('#aCode').value);
    if(code.length !== 8) return lockErr('Codes have 8 letters and numbers, like ABCD-EFGH.');
    const h = await sha(a.codeSalt + code);
    const idx = a.codes.findIndex(c => !c.used && c.h === h);
    if(idx < 0) return failed('That code is not valid or has already been used.');
    failCount = 0; recoverIdx = idx; lockView = 'newpw'; renderLock();
  },
  newpw: async () => {
    const a = getAuth(); if(!a || recoverIdx === null) return showLock('login');
    const user = $('#aUser').value.trim(), pw = $('#aPw').value, pw2 = $('#aPw2').value;
    if(user.length < 3) return lockErr('Username needs at least 3 characters.');
    const prob = pwProblem(pw, pw2); if(prob) return lockErr(prob);
    lockErr('Saving…');
    a.codes[recoverIdx].used = true; a.user = user;
    await setPassword(a, pw);
    if(!putAuth(a)) return lockErr('Could not save the new password.');
    setSession(a.user, true);
    const left = codesLeft(a);
    unlockApp();
    toast(`New password saved. ${left} recovery code${left === 1 ? '' : 's'} left.`, 3200);
    if(left <= 2) setTimeout(() => alertBox(`Only ${left} recovery code${left === 1 ? '' : 's'} left. Make a new set under Backup → Login & security.`), 600);
  },
  reset: async () => {
    if($('#aErase').value.trim().toUpperCase() !== 'ERASE') return lockErr('Type ERASE to confirm.');
    [KEY, PREV_KEY, AUTH_KEY, SESS_KEY].forEach(k => { try { localStorage.removeItem(k); } catch(_){} });
    clearSession();
    try { if(idbPromise){ (await idbPromise).close(); idbPromise = null; } } catch(_){}
    try { indexedDB.deleteDatabase(IDB_NAME); } catch(_){}
    photoCache.clear();
    data = emptyData(); indexBag();
    showLock('setup');
    toast('Everything erased. Create a new login, then restore your backup.', 3500);
  },
  changePw: async () => {
    const a = getAuth(); if(!a) return;
    if(!(await checkPassword(a, $('#sCur').value))) return sheetErr('Current password is wrong.');
    const prob = pwProblem($('#sPw').value, $('#sPw2').value); if(prob) return sheetErr(prob);
    await setPassword(a, $('#sPw').value); putAuth(a);
    closeSheet(); toast('Password changed');
  },
  changeUser: async () => {
    const a = getAuth(); if(!a) return;
    const user = $('#sUser').value.trim();
    if(user.length < 3) return sheetErr('Username needs at least 3 characters.');
    if(!(await checkPassword(a, $('#sCur').value))) return sheetErr('Password is wrong.');
    const keep = !!localStorage.getItem(SESS_KEY);
    a.user = user; putAuth(a); setSession(user, keep);
    closeSheet(); render(); toast('Username changed');
  },
  newCodes: async () => {
    const a = getAuth(); if(!a) return;
    if(!(await checkPassword(a, $('#sCur').value))) return sheetErr('Password is wrong.');
    const codes = newCodes(); Object.assign(a, await hashCodes(codes)); putAuth(a);
    pendingCodes = codes;
    openSheet(`<div class="grabber"></div>
      <div class="row between" style="margin-bottom:6px"><h3 style="margin:0">New recovery codes</h3><button class="btn ghost" data-action="doneNewCodes">Done</button></div>
      <p class="small ink2" style="margin:0">Your old codes no longer work. Save these somewhere safe off this phone. You won't see them again.</p>
      ${codesBlock(codes)}`);
    render();
  }
};
function sheetErr(msg){ const el = $('#sheetErr'); if(el) el.textContent = msg; }
function securityCard(){
  const a = getAuth(); if(!a) return '';
  const left = codesLeft(a);
  return `<h2 id="secLogin" style="margin-top:18px">Login &amp; security</h2>
    <div class="card">
      <div class="small ink2">Signed in as <b>${esc(a.user)}</b></div>
      <div class="small ink2" style="margin-top:2px">Recovery codes: <b>${left} of 8</b> unused${left <= 2 ? ' <span style="color:var(--danger);font-weight:600">— make a new set</span>' : ''}</div>
      <div class="cards2" style="margin-top:12px">
        <button class="btn" data-action="secSheet" data-v="changePw">Change password</button>
        <button class="btn" data-action="secSheet" data-v="changeUser">Change username</button>
        <button class="btn" data-action="secSheet" data-v="newCodes">New recovery codes</button>
        <button class="btn" data-action="signOut">Sign out</button>
      </div>
      <div class="note">The login stops anyone else opening the app on this phone. Backup files are not password-protected, so keep them in your own Dropbox.</div>
    </div>`;
}
function openSecSheet(kind){
  const a = getAuth(); if(!a) return;
  const cur = `<label class="field"><span>${kind === 'changePw' ? 'Current password' : 'Password'}</span><input id="sCur" type="password" autocomplete="current-password" required></label>`;
  const body = {
    changePw: `${cur}<label class="field"><span>New password</span><input id="sPw" type="password" autocomplete="new-password" required></label>
      <label class="field"><span>Repeat new password</span><input id="sPw2" type="password" autocomplete="new-password" required></label>`,
    changeUser: `<label class="field"><span>New username</span><input id="sUser" type="text" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" value="${esc(a.user)}" required></label>${cur}`,
    newCodes: `<p class="small ink2" style="margin:0 0 10px">This replaces all your recovery codes. Old codes will stop working.</p>${cur}`
  }[kind];
  const title = {changePw:'Change password', changeUser:'Change username', newCodes:'New recovery codes'}[kind];
  const btn = {changePw:'Save new password', changeUser:'Save username', newCodes:'Make new codes'}[kind];
  openSheet(`<div class="grabber"></div>
    <div class="row between" style="margin-bottom:8px"><h3 style="margin:0">${title}</h3><button class="btn ghost" type="button" data-action="closeSheet">Cancel</button></div>
    <form data-form="${kind}">${body}<div class="err" id="sheetErr"></div><button class="btn primary block" type="submit">${btn}</button></form>`);
}
document.addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target.dataset && e.target.dataset.form;
  if(f && authForms[f]) authForms[f](e.target).catch(err => { lockErr('Something went wrong. Try again.'); sheetErr('Something went wrong. Try again.'); });
});

/* ---------- start ---------- */
load();
if(activeSession()) ui.tab = 'range';
else if(activeRound()) ui.tab = 'rounds';
if(isUnlocked()){ render(); setTimeout(checkStale, 600); }
else showLock(getAuth() ? 'login' : 'setup');
try {
  photoLoadAll().then(() => { if(!lockView && (ui.tab === 'rounds' || ui.tab === 'backup' || ui.tab === 'golfer')) render(); })
    .catch(() => { photoStoreError = true; photosLoaded = true; });
} catch(_){ photoStoreError = true; photosLoaded = true; }
