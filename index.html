  } else if(v === 'cReset'){
    h += `<p class="sub">Set a new password</p>
      <p class="small ink2" style="text-align:center">We emailed <b>${esc(cloudEmail)}</b>. Enter the code from it (or tap the link in it on this device).</p>
      <form data-form="cReset" autocomplete="on">${codeField('Code from the email')}${newPwFields()}${e}<button class="btn primary block" type="submit">Save new password</button></form>
      <button class="linkbtn" type="button" data-action="lockGo" data-v="cForgot">Send a new code</button>
      <button class="linkbtn" type="button" data-action="lockGo" data-v="cIn">Back to sign in</button>`;
  } else if(v === 'cNewPw'){
    h += `<p class="sub">Set a new password</p>
      <form data-form="cNewPw" autocomplete="on">${newPwFields()}${e}<button class="btn primary block" type="submit">Save and sign in</button></form>`;
  }
  $('#lock').innerHTML = h + '</div>';
  const first = $('#lock input:not([type=checkbox])'); if(first && !first.value) setTimeout(() => { try { first.focus(); } catch(_){} }, 50);
}
function busyBtn(on){ const b = $('#lock button[type=submit]') || $('#sheet button[type=submit]'); if(b){ b.disabled = on; } }
async function cloudSignedIn(user, how){
  // first account sign-in on this device: what's already here goes into the account
  const prev = (() => { try { return localStorage.getItem(KEY + ':lastUid'); } catch(_){ return null; } })();
  if(prev && prev !== user.id){
    const keep = await confirmBox('Different account', 'This device has golf data from another account. Replace it with this account\'s data? (Download a backup first if unsure.)', 'Use this account');
    if(!keep){ await sbc().auth.signOut({scope:'local'}); return showLock('cIn'); }
    try { localStorage.setItem(PREV_KEY, JSON.stringify(data)); } catch(_){}
    const settings = data.settings; data = emptyData(); data.settings = settings; localStorage.removeItem(BASE_KEY); save(false);
  }
  setCloudUser(user);
  try { localStorage.setItem(KEY + ':lastUid', user.id); } catch(_){}
  [AUTH_KEY, SESS_KEY].forEach(k => { try { localStorage.removeItem(k); } catch(_){} });   // the old on-phone login is no longer needed
  clearSession();
  unlockApp();
  if(how) toast(how, 2600);
  syncNow();
}
const cloudForms = {
  cSetup: async () => {
    const url = $('#cUrl').value.trim().replace(/\/+$/, '').toLowerCase(), key = $('#cKey').value.trim();
    if(/^sb_secret_/.test(key) || /service_role/.test(key)) return lockErr("That's the secret key. Never put it in an app. Use the Publishable key (starts sb_publishable_).");
    if(!/^https:\/\/[a-z0-9-]+\.supabase\.co$/.test(url)) return lockErr('The Project URL looks like https://xxxx.supabase.co');
    if(!/^sb_publishable_[\w-]{10,}$/.test(key) && !/^eyJ[\w-]+\.[\w-]+\.[\w-]+$/.test(key)) return lockErr('The Publishable key starts sb_publishable_');
    localStorage.setItem(CLOUD_CFG_KEY, JSON.stringify({url, key}));
    location.reload();
  },
  cIn: async () => {
    const email = cleanEmail($('#cEmail').value), pw = $('#cPw').value; cloudEmail = email;
    if(!okEmail(email)) return lockErr('Enter your email address.');
    if(throttled()) return;
    lockErr('Signing in…'); busyBtn(true);
    const {data:d, error} = await sbc().auth.signInWithPassword({email, password:pw}); busyBtn(false);
    if(error) return failed(cloudMsg(error));
    failCount = 0; cloudSignedIn(d.user, 'Signed in');
  },
  cUp: async () => {
    const email = cleanEmail($('#cEmail').value), pw = $('#cPw').value; cloudEmail = email;
    if(!okEmail(email)) return lockErr('Enter your email address.');
    const prob = cloudPwProblem(pw, $('#cPw2').value); if(prob) return lockErr(prob);
    lockErr('Creating your account…'); busyBtn(true);
    const {data:d, error} = await sbc().auth.signUp({email, password:pw, options:{emailRedirectTo: location.origin + location.pathname}}); busyBtn(false);
    if(error) return lockErr(cloudMsg(error));
    if(d.session) return cloudSignedIn(d.user, 'Account created');
    lockView = 'cConfirm'; renderCloudLock();
  },
  cConfirm: async () => {
    const token = cleanCode($('#cCode').value);
    if(token.length < 6) return lockErr('Enter the code from the email.');
    lockErr('Checking…'); busyBtn(true);
    let r = await sbc().auth.verifyOtp({email:cloudEmail, token, type:'email'});
    if(r.error) r = await sbc().auth.verifyOtp({email:cloudEmail, token, type:'signup'});
    busyBtn(false);
    if(r.error) return failed(cloudMsg(r.error));
    cloudSignedIn(r.data.user, 'Email confirmed');
  },
  cForgot: async () => {
    const email = cleanEmail($('#cEmail').value); cloudEmail = email;
    if(!okEmail(email)) return lockErr('Enter your email address.');
    lockErr('Sending…'); busyBtn(true);
    const {error} = await sbc().auth.resetPasswordForEmail(email, {redirectTo: location.origin + location.pathname}); busyBtn(false);
    if(error) return lockErr(cloudMsg(error));
    lockView = 'cReset'; renderCloudLock(); toast('Code sent. Check your email.', 2600);
  },
  cReset: async () => {
    const token = cleanCode($('#cCode').value), pw = $('#cPw').value;
    if(token.length < 6) return lockErr('Enter the code from the email.');
    const prob = cloudPwProblem(pw, $('#cPw2').value); if(prob) return lockErr(prob);
    if(throttled()) return;
    lockErr('Checking…'); busyBtn(true);
    const v = await sbc().auth.verifyOtp({email:cloudEmail, token, type:'recovery'});
    if(v.error){ busyBtn(false); return failed(cloudMsg(v.error)); }
    const u = await sbc().auth.updateUser({password:pw}); busyBtn(false);
    if(u.error) return lockErr(cloudMsg(u.error));
    failCount = 0; cloudSignedIn(u.data.user || v.data.user, 'New password saved');
  },
  cNewPw: async () => {
    const pw = $('#cPw').value, prob = cloudPwProblem(pw, $('#cPw2').value); if(prob) return lockErr(prob);
    lockErr('Saving…'); busyBtn(true);
    const u = await sbc().auth.updateUser({password:pw}); busyBtn(false);
    if(u.error) return lockErr(cloudMsg(u.error));
    cloudSignedIn(u.data.user, 'New password saved');
  },
  // Settings: change password needs the code we email you (checked by Supabase every time)
  cChangePw: async () => {
    const u = cloudUser(); if(!u) return;
    if(cloudStep !== 'code'){
      sheetErr('Sending…');
      const {error} = await sbc().auth.resetPasswordForEmail(u.email, {redirectTo: location.origin + location.pathname});
      if(error) return sheetErr(cloudMsg(error));
      cloudStep = 'code'; openCloudPwSheet(); toast('Code sent. Check your email.', 2600); return;
    }
    const token = cleanCode($('#cCode').value), pw = $('#cPw').value;
    if(token.length < 6) return sheetErr('Enter the code from the email.');
    const prob = cloudPwProblem(pw, $('#cPw2').value); if(prob) return sheetErr(prob);
    sheetErr('Checking…');
    const v = await sbc().auth.verifyOtp({email:u.email, token, type:'recovery'});
    if(v.error) return sheetErr(cloudMsg(v.error));
    const r = await sbc().auth.updateUser({password:pw});
    if(r.error) return sheetErr(cloudMsg(r.error));
    cloudStep = null; closeSheet(); toast('Password changed');
  }
};
Object.assign(authForms, cloudForms);
function openCloudPwSheet(){
  const u = cloudUser(); if(!u) return;
  const step2 = cloudStep === 'code';
  openSheet(`<div class="grabber"></div>
    <div class="row between" style="margin-bottom:8px"><h3 style="margin:0">Change password</h3><button class="btn ghost" type="button" data-action="closeSheet">Cancel</button></div>
    <form data-form="cChangePw" autocomplete="on">
      ${step2 ? `<p class="small ink2" style="margin:0 0 10px">We emailed a code to <b>${esc(u.email)}</b>.</p>${codeField('Code from the email')}${newPwFields()}`
              : `<p class="small ink2" style="margin:0 0 10px">For safety, changing your password needs a code that we email to <b>${esc(u.email)}</b>.</p>`}
      <div class="err" id="sheetErr"></div>
      <button class="btn primary block" type="submit">${step2 ? 'Save new password' : 'Email me a code'}</button>
    </form>`);
}
function syncLine(){
  const st = syncState, t = st.at ? ago(st.at) : '';
  if(syncBusy) return 'Syncing…';
  if(st.status === 'ok') return `Synced ${t}`;
  if(st.status === 'offline') return 'Offline: changes are saved on this device and will sync when you are back online.';
  if(st.status === 'signin') return '<span style="color:var(--danger)">Sign in again to sync.</span>';
  if(st.status === 'error') return `<span style="color:var(--danger)">Not synced: ${esc(st.msg)}</span>`;
  return 'Not synced yet';
}
function cloudAccountCard(){
  const u = cloudUser(); if(!u) return '';
  return `<h2 id="secLogin" style="margin-top:18px">Account &amp; security</h2>
    <div class="card">
      <div class="small ink2">Signed in as <b>${esc(u.email)}</b></div>
      <div class="small ink2" style="margin-top:2px" id="syncLine">${syncLine()}</div>
      <div class="cards2" style="margin-top:12px">
        <button class="btn" data-action="syncNow">Sync now</button>
        <button class="btn" data-action="cloudPw">Change password</button>
        <button class="btn" data-action="cloudOut">Sign out</button>
      </div>
      <div class="note">Your sessions, rounds, profile and bag sync between your devices. Scorecard photos and round photos/videos stay on the device you added them on.</div>
    </div>`;
}
function renderSyncLine(){ const el = $('#syncLine'); if(el) el.innerHTML = syncLine(); }

/* ---- sync: one row per account holds the shared copy; each device merges and writes back ---- */
const DEVICE_SETTINGS = ['keepAwake', 'hideHomeTip', 'lastClub', 'lastRoundClub'];
function syncView(d){
  const settings = Object.assign({}, d.settings); DEVICE_SETTINGS.forEach(k => delete settings[k]);
  return {schema:SCHEMA, at:d.meta.updatedAt || 0, sessions:d.sessions, rounds:d.rounds, profile:d.profile, bag:d.bag, courses:d.courses, settings, deleted:d.deleted || {}};
}
const sameJ = (a, b) => JSON.stringify(a) === JSON.stringify(b);
function mergeSynced(base, local, remote){
  // sessions and rounds: newest edit wins per item; deletions win over older edits
  const dead = Object.assign({}, remote.deleted || {});
  Object.entries(local.deleted || {}).forEach(([k, v]) => { if(!(dead[k] >= v)) dead[k] = v; });
  const byId = (a, b) => {
    const m = new Map();
    a.concat(b).forEach(x => { const cur = m.get(x.id); if(!cur || (x.updatedAt || x.startedAt || 0) > (cur.updatedAt || cur.startedAt || 0)) m.set(x.id, x); });
    return Array.from(m.values()).filter(x => !(dead[x.id] >= (x.updatedAt || x.startedAt || 0)));
  };
  // profile, bag, course pars, settings: take whichever side changed since the last sync (newest if both did)
  const pick = k => {
    if(base){ if(sameJ(local[k], base[k])) return remote[k]; if(sameJ(remote[k], base[k])) return local[k]; }
    return (remote.at || 0) > (local.at || 0) ? remote[k] : local[k];
  };
  return {schema:SCHEMA, at:Math.max(local.at || 0, remote.at || 0), sessions:byId(local.sessions, remote.sessions), rounds:byId(local.rounds, remote.rounds),
    profile:pick('profile'), bag:pick('bag'), courses:pick('courses'), settings:pick('settings'), deleted:dead};
}
function scheduleSync(ms = 2500){ if(!cloudOn() || !cloudUser()) return; clearTimeout(syncTimer); syncTimer = setTimeout(syncNow, ms); }
async function syncNow(){
  if(!cloudOn() || !cloudUser()) return;
  if(syncBusy){ syncAgain = true; return; }
  if(!navigator.onLine){ syncState = {status:'offline', at:syncState.at}; renderSyncLine(); return; }
  syncBusy = true; renderSyncLine();
  try {
    const {data:{session}} = await sbc().auth.getSession();
    if(!session){ syncState = {status:'signin', at:syncState.at}; return; }
    const uid = session.user.id;
    for(let attempt = 0; attempt < 3; attempt++){
      const {data:row, error} = await sbc().from('golf_data').select('data,updated_at').eq('user_id', uid).maybeSingle();
      if(error) throw error;
      let base = null; try { base = JSON.parse(localStorage.getItem(BASE_KEY) || 'null'); } catch(_){}
      if(base && base.uid !== uid) base = null;
      const local = syncView(data);
      const remote = row && row.data ? syncView(normalise(row.data)) : null;
      const merged = remote ? mergeSynced(base && base.v, local, remote) : local;
      if(!sameJ(merged, local)){
        // bring the other device's changes into this one
        const keep = {}; DEVICE_SETTINGS.forEach(k => keep[k] = data.settings[k]);
        const meta = data.meta;
        const next = normalise(Object.assign({}, merged, {settings:Object.assign({}, merged.settings, keep)}));
        next.meta = Object.assign({}, meta);
        data = next; applyingRemote = true; save(false); applyingRemote = false;
        if(!lockView) render();
      }
      const toSend = syncView(data);
      if(!remote || !sameJ(toSend, remote)){
        const now = new Date().toISOString();
        if(row){
          const {data:upd, error:e2} = await sbc().from('golf_data').update({data:toSend, updated_at:now}).eq('user_id', uid).eq('updated_at', row.updated_at).select('updated_at');
          if(e2) throw e2;
          if(!upd || !upd.length) continue;      // the other device saved in between: merge again
        } else {
          const {error:e3} = await sbc().from('golf_data').insert({user_id:uid, data:toSend, updated_at:now});
          if(e3){ if(e3.code === '23505') continue; throw e3; }
        }
      }
      localStorage.setItem(BASE_KEY, JSON.stringify({uid, v:syncView(data)}));
      syncState = {status:'ok', at:Date.now()};
      return;
    }
    syncState = {status:'error', at:syncState.at, msg:'your other device kept changing it. Try Sync now.'};
  } catch(e){
    syncState = navigator.onLine ? {status:'error', at:syncState.at, msg:cloudMsg(e, 'could not reach your account.')} : {status:'offline', at:syncState.at};
  } finally {
    syncBusy = false; renderSyncLine();
    if(syncAgain){ syncAgain = false; scheduleSync(400); }
  }
}
function cloudStart(){
  sbc();
  // the "reset password" link from the email opens the app with type=recovery in the address
  const hashRecovery = /type=recovery/.test(location.hash);
  if(cloudUser() && !hashRecovery){ render(); setTimeout(checkStale, 600); setTimeout(syncNow, 800); }
  else if(hashRecovery) showLock('cNewPw');
  else showLock('cIn');
  addEventListener('online', () => scheduleSync(300));
  addEventListener('offline', () => { syncState = {status:'offline', at:syncState.at}; renderSyncLine(); });
  document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible') scheduleSync(300); });
  setInterval(() => { if(document.visibilityState === 'visible') syncNow(); }, 45000);
}

document.addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target.dataset && e.target.dataset.form;
  if(f && authForms[f]) authForms[f](e.target).catch(err => { lockErr('Something went wrong. Try again.'); sheetErr('Something went wrong. Try again.'); });
});

/* ---------- start ---------- */
load();
if(activeSession()) ui.tab = 'range';
else if(activeRound()) ui.tab = 'rounds';
if(cloudOn()) cloudStart();
else if(CLOUD_SETUP && window.supabase) showLock('cSetup');
else if(isUnlocked()){ render(); setTimeout(checkStale, 600); }
else showLock(getAuth() ? 'login' : 'setup');
try {
  mediaLoadThumbs().then(() => { if(!lockView && ui.tab === 'rounds') render(); }).catch(() => {});
  photoLoadAll().then(() => { if(!lockView && (ui.tab === 'rounds' || ui.tab === 'backup' || ui.tab === 'golfer')) render(); })
    .catch(() => { photoStoreError = true; photosLoaded = true; });
} catch(_){ photoStoreError = true; photosLoaded = true; }
